<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;

    --line:#202020;
    --line2:#2a2a2a;

    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;

    --danger:#ff4b4b;

    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;

    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;

    font-family:'Inter',sans-serif;

    color:var(--text);

    display:flex;
    justify-content:center;

    min-height:100vh;

    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;

    background:
        linear-gradient(180deg,#111111,#0a0a0a);

    border:1px solid var(--line);

    border-radius:34px;

    padding:34px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;

    padding-bottom:24px;

    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;

    font-size:1.05rem;

    letter-spacing:4px;

    font-weight:800;

    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;

    color:var(--dim);

    font-size:.78rem;

    letter-spacing:1px;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:12px;

    margin:26px 0;
}

.tab-btn{
    background:
        linear-gradient(180deg,#181818,#111111);

    border:1px solid #262626;

    color:#8d8d8d;

    padding:12px 18px;

    border-radius:999px;

    cursor:pointer;

    transition:var(--transition);

    font-size:.7rem;

    font-weight:700;

    letter-spacing:1px;

    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);

    color:#fff;

    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;

    color:#000;

    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

input[type="text"]{
    width:100%;

    background:#0c0c0c;

    border:1px solid #242424;

    color:#fff;

    padding:16px;

    border-radius:18px;

    outline:none;

    font-size:.9rem;

    margin-bottom:18px;

    transition:var(--transition);
}

input[type="text"]:focus{
    border-color:#555;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;

    background:#0c0c0c;

    border:1px solid #232323;

    border-radius:18px;

    padding:12px 16px;

    margin-bottom:18px;

    width:fit-content;

    margin-left:auto;
    margin-right:auto;
}

.checkbox-label{
    display:flex;
    align-items:center;

    gap:8px;

    font-size:.68rem;

    font-weight:700;

    letter-spacing:.5px;

    color:#d8d8d8;

    white-space:nowrap;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk-deliver{
    background:#fff;

    color:#000;

    border:none;

    padding:10px 14px;

    border-radius:12px;

    cursor:pointer;

    font-size:.62rem;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:1px;
}

.cat-grid{
    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));

    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:14px;

    cursor:pointer;

    transition:var(--transition);
}

.cat-circle:hover{
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;

    border-radius:26px;

    background:
        linear-gradient(180deg,#181818,#0d0d0d);

    border:1px solid #262626;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:var(--transition);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 18px 35px rgba(0,0,0,.45);
}

.cat-circle:hover .cat-icon-bg{
    border-color:#4e4e4e;
}

.cat-icon-bg svg{
    width:38px;
    height:38px;

    fill:#f3f3f3;
}

.cat-label{
    font-size:.65rem;

    letter-spacing:1.4px;

    font-weight:700;

    text-transform:uppercase;

    color:#9c9c9c;

    text-align:center;
}

.item-list{
    list-style:none;

    margin:0;
    padding:0;

    border-radius:24px;

    overflow:hidden;

    border:1px solid #202020;

    background:#0c0c0c;
}

.item{
    display:grid;

    grid-template-columns:auto 1fr auto;

    gap:16px;

    align-items:center;

    padding:18px 20px;

    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;

    font-weight:500;

    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;

    gap:10px;
}

.cat-badge{
    width:38px;
    height:38px;

    border-radius:14px;

    border:1px solid #292929;

    background:#070707;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:all .2s ease;
}

.cat-badge:hover{
    border-color:#555;

    transform:translateY(-1px);
}

.cat-badge svg{
    width:16px;
    height:16px;

    fill:#fff;
}

.btn-action{
    background:
        linear-gradient(180deg,#1a1a1a,#111);

    border:1px solid #303030;

    color:#fff;

    padding:10px 14px;

    border-radius:12px;

    cursor:pointer;

    font-size:.66rem;

    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;
}

.btn-delete{
    border-color:#442222;

    color:var(--danger);
}

.empty-watermark{
    padding:80px 20px;

    text-align:center;
}

.empty-watermark-title{
    font-size:1rem;

    font-weight:700;

    letter-spacing:2px;

    margin-bottom:10px;
}

.empty-watermark-sub{
    color:#666;
}

.footer-status{
    margin-top:24px;

    text-align:center;

    font-size:.75rem;

    color:#666;
}

</style>
</head>
<body>

<svg style="display:none;">

<symbol id="icon-clothing" viewBox="0 0 24 24">
<path d="M12 3l4 3 3-1 2 4-3 2v8H6v-8L3 9l2-4 3 1z"/>
</symbol>

<symbol id="icon-hairs" viewBox="0 0 24 24">
<path d="M12 2C7.5 2 4 5.4 4 10v3c0 5 3.3 9 8 9s8-4 8-9v-3c0-4.6-3.5-8-8-8zm-5 8.3c1.2-.4 2.5-1.3 3.6-2.5.8 1.8 2.7 3.3 5.4 4.1V13c0 3.7-2.1 6-5 6s-5-2.3-5-6v-2.7zm10 1.2c-3.4-.8-5.5-2.6-6.2-5.3-.9 1.5-2.7 3.1-4.8 4V10c0-3.3 2.4-5.7 6-5.7s6 2.4 6 5.7v1.5z"/>
</symbol>

<symbol id="icon-faceskin" viewBox="0 0 24 24">
<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-4 7a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm8 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm-4 8c-2 0-3.7-1-4.5-2.5h9C15.7 16 14 17 12 17z"/>
</symbol>

<symbol id="icon-bodyskin" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 013 3v2h2c1.7 0 3 1.3 3 3v9h-3v-5h-2v5H9v-5H7v5H4v-9c0-1.7 1.3-3 3-3h2V5a3 3 0 013-3z"/>
</symbol>

<symbol id="icon-meshhead" viewBox="0 0 24 24">
<path d="M12 2C7 2 4 6 4 11v2c0 5 3 9 8 9s8-4 8-9v-2c0-5-3-9-8-9z"/>
</symbol>

<symbol id="icon-meshbody" viewBox="0 0 24 24">
<path d="M12 2a4 4 0 100 8 4 4 0 000-8zm0 10c-4 0-7 2-7 5v3h14v-3c0-3-3-5-7-5z"/>
</symbol>

<symbol id="icon-accessories" viewBox="0 0 24 24">
<path d="M12 2l9 7-9 13L3 9l9-7z"/>
</symbol>

<symbol id="icon-houses" viewBox="0 0 24 24">
<path d="M12 3L3 11h3v9h12v-9h3z"/>
</symbol>

<symbol id="icon-decor" viewBox="0 0 24 24">
<path d="M4 10h16v8H4zM7 6h10v2H7z"/>
</symbol>

<symbol id="icon-objects" viewBox="0 0 24 24">
<path d="M12 2l8 4v12l-8 4-8-4V6z"/>
</symbol>

<symbol id="icon-textures" viewBox="0 0 24 24">
<path d="M3 3h18v18H3zM7 7h4v4H7zm6 0h4v4h-4zm-6 6h4v4H7zm6 0h4v4h-4z"/>
</symbol>

<symbol id="icon-scripts" viewBox="0 0 24 24">
<path d="M8 6L2 12l6 6 2-2-4-4 4-4zm8 0l-2 2 4 4-4 4 2 2 6-6z"/>
</symbol>

</svg>

<div class="container">

<header>
<h1>✦ PERSONAL INVENTORY</h1>
<div class="subtitle">powered by Saori Suki</div>
</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory', this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories', this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('search', this)">
Search
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" class="item-cb">
Select All
</label>

<button class="btn-bulk-deliver">
Deliver Selected
</button>

</div>

<!-- LISTA REAL SINCRONIZADA PELO SCRIPT -->

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-categories" class="tab-content">

<div class="cat-grid">

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-clothing"></use></svg></div>
<div class="cat-label">Clothing</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-hairs"></use></svg></div>
<div class="cat-label">Hair</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-faceskin"></use></svg></div>
<div class="cat-label">Face Skin</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-bodyskin"></use></svg></div>
<div class="cat-label">Body Skin</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-meshhead"></use></svg></div>
<div class="cat-label">Mesh Head</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-meshbody"></use></svg></div>
<div class="cat-label">Mesh Body</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-accessories"></use></svg></div>
<div class="cat-label">Accessories</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-houses"></use></svg></div>
<div class="cat-label">Houses</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-decor"></use></svg></div>
<div class="cat-label">Decor</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-objects"></use></svg></div>
<div class="cat-label">Objects</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-textures"></use></svg></div>
<div class="cat-label">Textures</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg"><svg><use href="#icon-scripts"></use></svg></div>
<div class="cat-label">Scripts</div>
</div>

</div>

</div>

<div id="tab-search" class="tab-content">

<input type="text" placeholder="Search folders, outfits, brands...">

<div class="empty-watermark">

<div class="empty-watermark-title">
Search Engine
</div>

<div class="empty-watermark-sub">
Type something to begin searching.
</div>

</div>

</div>

<div class="footer-status">
Inventory connected successfully.
</div>

</div>

<script>

function switchTab(tabId, btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

</script>

</body>
</html>

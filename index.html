<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --green:#52ff9c;
    --danger:#ff4b4b;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
    position:relative;
}

.status-badge{
    position:absolute;
    top:0;
    right:0;
    background:#0f0f0f;
    border:1px solid #2a2a2a;
    padding:10px 14px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:1px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:999px;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.top-stats{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:22px;
    flex-wrap:wrap;
}

.stat-card{
    background:#0d0d0d;
    border:1px solid #202020;
    border-radius:18px;
    padding:14px 18px;
    min-width:120px;
}

.stat-label{
    color:#777;
    font-size:.62rem;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.stat-value{
    font-size:1rem;
    font-weight:700;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.search-box{
    width:100%;
    margin-bottom:18px;
}

.search-input{
    width:100%;
    background:#0c0c0c;
    border:1px solid #242424;
    color:#fff;
    padding:18px 20px;
    border-radius:18px;
    outline:none;
    font-size:.9rem;
}

.search-input:focus{
    border-color:#444;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    padding:12px 16px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
    flex-wrap:wrap;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.5px;
    color:#d8d8d8;
}

.item-cb{
    accent-color:#fff;
}

.btn{
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:var(--transition);
}

.btn-white{
    background:#fff;
    color:#000;
}

.btn-dark{
    background:#111;
    border:1px solid #252525;
    color:#fff;
}

.btn:hover{
    transform:translateY(-1px);
}

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:var(--transition);
}

.cat-circle:hover{
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;
    border-radius:26px;
    background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:var(--transition);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 18px 35px rgba(0,0,0,.45);
}

.cat-icon-bg:hover{
    border-color:#4e4e4e;
}

.cat-icon{
    width:28px;
    height:28px;
    border:2px solid white;
    border-radius:10px;
    opacity:.9;
}

.cat-label{
    font-size:.65rem;
    letter-spacing:1.4px;
    font-weight:700;
    text-transform:uppercase;
    color:#9c9c9c;
    text-align:center;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.action-btn{
    width:38px;
    height:38px;
    border-radius:14px;
    border:1px solid #292929;
    background:#070707;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:all .2s ease;
    font-size:.7rem;
    font-weight:700;
}

.action-btn:hover{
    border-color:#555;
    transform:translateY(-1px);
}

.footer-status{
    margin-top:24px;
    text-align:center;
    font-size:.75rem;
    color:#666;
}

.toast{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    border:1px solid #2a2a2a;
    color:#fff;
    padding:14px 18px;
    border-radius:16px;
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
    z-index:999;
}

.toast.show{
    opacity:1;
    bottom:40px;
}

</style>
</head>
<body>

<div class="container">

<header>

<div class="status-badge">
<div class="status-dot"></div>
CONNECTED
</div>

<h1>✦ PERSONAL INVENTORY</h1>
<div class="subtitle">powered by Saori Suki</div>

<div class="top-stats">

<div class="stat-card">
<div class="stat-label">Folders</div>
<div class="stat-value" id="folderCount">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Selected</div>
<div class="stat-value" id="selectedCount">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Status</div>
<div class="stat-value">LIVE</div>
</div>

</div>

</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory', this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories', this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('tools', this)">
Tools
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="search-box">
<input type="text" class="search-input" placeholder="Search folders..." oninput="filterInventory(this.value)">
</div>

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" class="item-cb" onchange="toggleAll(this)">
Select All
</label>

<button class="btn btn-white" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-categories" class="tab-content">

<div class="cat-grid">

<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Clothing</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Hair</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Face Skin</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Body Skin</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Mesh Head</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Mesh Body</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Accessories</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Skybox</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Houses</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Decor</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Objects</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Textures</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><div class="cat-icon"></div></div><div class="cat-label">Scripts</div></div>

</div>

</div>

<div id="tab-tools" class="tab-content">

<div class="bulk-actions">

<button class="btn btn-dark" onclick="sendCommand('CMD:RESET')">
Reset Script
</button>

<button class="btn btn-dark" onclick="scanDuplicates()">
Scan Duplicates
</button>

</div>

</div>

<div class="footer-status">
MMC Storage Remote Interface
</div>

</div>

<div class="toast" id="toast"></div>

<script>

const API = new URLSearchParams(location.search).get("api");

let inventoryData = [];

function toast(msg){
    const t=document.getElementById("toast");
    t.innerText=msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2500);
}

function switchTab(tabId, btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

async function loadInventory(){

    if(!API){
        toast("Missing SL API");
        return;
    }

    try{

        const res = await fetch(API);
        const data = await res.json();

        inventoryData = data;

        renderInventory(data);

        document.getElementById("folderCount").innerText=data.length;

    }catch(e){

        toast("Connection failed");

    }
}

function renderInventory(items){

    const list=document.getElementById("inventory-list");

    list.innerHTML="";

    items.forEach(name=>{

        list.innerHTML += `
        <li class="item">

            <input type="checkbox" class="item-cb item-select">

            <div class="item-name">${decodeURIComponent(name)}</div>

            <div class="item-actions">

                <button class="action-btn" onclick="deliverItem('${name}', this)">
                ⇣
                </button>

                <button class="action-btn" onclick="deleteItem('${name}', this)">
                ✕
                </button>

            </div>

        </li>
        `;

    });

}

async function deliverItem(name,btn){

    btn.innerText="...";

    await fetch(API,{
        method:"POST",
        body:decodeURIComponent(name)
    });

    btn.innerText="✔";

    toast("Delivered");

    setTimeout(()=>{
        btn.innerText="⇣";
    },1200);
}

async function deleteItem(name,btn){

    btn.innerText="...";

    await fetch(API,{
        method:"POST",
        body:"MENU_DEL:"+decodeURIComponent(name)
    });

    btn.innerText="✔";

    toast("Check SL popup");

    setTimeout(()=>{
        btn.innerText="✕";
    },1200);
}

function toggleAll(el){

    document.querySelectorAll(".item-select").forEach(cb=>{
        cb.checked=el.checked;
    });

    updateSelectedCount();
}

function updateSelectedCount(){

    const total=[...document.querySelectorAll(".item-select")]
    .filter(x=>x.checked).length;

    document.getElementById("selectedCount").innerText=total;
}

document.addEventListener("change",e=>{

    if(e.target.classList.contains("item-select")){
        updateSelectedCount();
    }

});

async function deliverSelected(){

    const selected=[];

    document.querySelectorAll(".item").forEach(item=>{

        const cb=item.querySelector(".item-select");

        if(cb.checked){

            selected.push(
                item.querySelector(".item-name").innerText
            );

        }

    });

    if(selected.length===0){
        toast("Nothing selected");
        return;
    }

    await fetch(API,{
        method:"POST",
        body:selected.join("\n")
    });

    toast("Bulk delivery completed");
}

function filterInventory(query){

    query=query.toLowerCase();

    const filtered=inventoryData.filter(x=>
        decodeURIComponent(x).toLowerCase().includes(query)
    );

    renderInventory(filtered);
}

async function sendCommand(cmd){

    await fetch(API,{
        method:"POST",
        body:cmd
    });

    toast("Command executed");
}

async function scanDuplicates(){

    toast("Check SL local chat");
}

loadInventory();

setInterval(loadInventory,15000);

</script>

</body>
</html>

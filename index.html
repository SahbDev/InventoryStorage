<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --danger:#ff4b4b;
    --transition:all .22s ease;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
    display: flex;
    flex-direction: column;
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    outline: none;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{ display:none; }
.tab-content.active{ display:block; }

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:16px;
    padding:10px 14px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:1px;
    color:#d8d8d8;
    text-transform:uppercase;
    cursor: pointer;
}

.item-cb{ accent-color:#fff; cursor: pointer; }

.btn-bulk-deliver{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:.2s;
}
.btn-bulk-deliver:hover{ transform:translateY(-1px); }

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:var(--transition);
}
.cat-circle:hover{ transform:translateY(-4px); }

.cat-icon-bg{
    width:88px;
    height:88px;
    border-radius:26px;
    background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:var(--transition);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 18px 35px rgba(0,0,0,.45);
}
.cat-circle:hover .cat-icon-bg{ border-color:#4e4e4e; }
.cat-icon-bg svg{ width:42px; height:42px; fill:#f3f3f3; }
.cat-label{ font-size:.65rem; letter-spacing:1.4px; font-weight:700; text-transform:uppercase; color:#9c9c9c; text-align:center; }
.cat-circle:hover .cat-label { color:#ffffff; }

.item-list{
    list-style:none;
    margin:0; padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
    max-height: 450px;
    overflow-y: auto;
}
.item-list::-webkit-scrollbar { width: 6px; }
.item-list::-webkit-scrollbar-thumb { background: #202020; border-radius: 3px; }

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
    transition:.2s;
}
.item:hover{ background:#111; }
.item:last-child{ border-bottom:none; }
.item-name{ font-size:.88rem; font-weight:500; word-break:break-word; }
.item-actions{ display:flex; align-items:center; gap:10px; }

.cat-badge{
    width:38px; height:38px;
    border-radius:14px;
    border:1px solid #292929;
    background:#070707;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
}
.cat-badge:hover{ border-color:#555; transform:translateY(-1px); }
.cat-badge svg{ width:16px; height:16px; fill:#fff; }

.cat-tooltip{
    position:absolute; bottom:-34px; left:50%;
    transform:translateX(-50%);
    background:#fff; color:#000;
    font-size:.55rem; font-weight:800;
    padding:6px 8px; border-radius:8px;
    letter-spacing:1px; opacity:0;
    pointer-events:none; transition:.18s;
    white-space:nowrap; text-transform:uppercase;
    z-index:20;
}
.cat-badge:hover .cat-tooltip{ opacity:1; bottom:-30px; }

.action-btn{
    border:none; border-radius:12px;
    padding:10px 12px; font-size:.62rem;
    font-weight:800; cursor:pointer;
    letter-spacing:1px; text-transform:uppercase;
    transition:var(--transition); white-space: nowrap;
}
.deliver-btn{ background:#fff; color:#000; }
.delete-btn{ background:#1a1a1a; color:#ff5d5d; border:1px solid #2f2f2f; }
.action-btn:hover{ transform:translateY(-2px); }

.search-box{
    width:100%; background:#0d0d0d;
    border:1px solid #232323; color:#fff;
    border-radius:18px; padding:16px 18px;
    outline:none; font-size:.85rem; text-align: center;
    margin-bottom: 20px;
}
.search-box:focus{ border-color:#4d4d4d; }

.back-btn{
    background:#fff; color:#000; border:none;
    padding:12px 18px; border-radius:14px;
    cursor:pointer; margin-bottom:20px; font-weight:700;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
    transition: var(--transition);
}
.back-btn:hover { transform: translateY(-1px); }

.empty-watermark{ padding:80px 20px; text-align:center; }
.empty-watermark-title{ font-size:1rem; font-weight:700; letter-spacing:2px; margin-bottom:10px; text-transform: uppercase; }
.empty-watermark-sub{ color:#666; }
.footer-status{ margin-top:24px; text-align:center; font-size:.75rem; color:#666; }
.loading{ padding:40px; text-align:center; color:#666; font-size: 0.85rem; }

.modal{
    position:fixed; inset:0;
    background:rgba(0,0,0,.7);
    display:none; align-items:center;
    justify-content:center; z-index:999;
}
.modal.active{ display:flex; }
.modal-box{ width:95%; max-width:420px; background:#0e0e0e; border:1px solid #252525; border-radius:28px; padding:24px; }
.modal-title{ font-size:.95rem; font-weight:700; margin-bottom:18px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
.modal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-height: 280px; overflow-y: auto; padding: 4px; }
.modal-cat{ background:#141414; border:1px solid #262626; border-radius:18px; padding:16px 10px; cursor:pointer; text-align:center; font-size:.65rem; font-weight:700; text-transform: uppercase; }
.modal-cat:hover{ border-color:#555; background: #1a1a1a; }
.hidden{ display:none !important; }
</style>
</head>
<body>

<svg style="display:none;">

</svg>

<div class="container">
    <header>
        <h1>✦ PERSONAL INVENTORY</h1>
        <div class="subtitle">powered by Saori Suki</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('inventory', this)">Inventory</button>
        <button class="tab-btn" onclick="switchTab('categories', this)">Categories</button>
        <button class="tab-btn" onclick="switchTab('search', this)">Search</button>
    </div>

    <div id="tab-inventory" class="tab-content active">
        <div class="bulk-actions" id="bulkInv" style="display: none;">
            <label class="checkbox-label"><input type="checkbox" id="select-all" class="item-cb"> Select All</label>
            <button class="btn-bulk-deliver" onclick="deliverSelected()">Deliver Selected</button>
        </div>
        <ul class="item-list" id="inventory-list"><div class="loading">Loading inventory from SL server...</div></ul>
    </div>

    <div id="tab-categories" class="tab-content">
        <div id="categories-home">
            <div class="cat-grid" id="cat-grid"></div>
        </div>
        
        <div id="category-view" class="hidden">
            <div class="cat-view-header">
                <div class="cat-view-title" id="catViewTitle">📁 CATEGORY: NAME</div>
                <button class="back-btn" onclick="closeCategoryView()">← Back</button>
            </div>
            <ul class="item-list" id="category-items"></ul>
        </div>
    </div>

    <div id="tab-search" class="tab-content">
        <input class="search-box" id="search-input" placeholder="Search inventory folders..." oninput="searchInventory(this.value)">
        <ul class="item-list" id="search-results"></ul>
    </div>

    <div class="footer-status" id="status">Initialising secure stream connection...</div>
</div>

<div class="modal" id="category-modal">
    <div class="modal-box">
        <div class="modal-title">Assign Category</div>
        <div class="modal-grid" id="modal-grid"></div>
        <button type="button" class="btn-panel" style="margin-top:20px; border-radius: 14px;" onclick="document.getElementById('category-modal').classList.remove('active')">Cancel</button>
    </div>
</div>

<script>
    const api = new URLSearchParams(window.location.search).get("api");

    const categories = {
        "Clothing": "icon-clothing", "Hair": "icon-hairs", "Face Skin": "icon-faceskin", "Body Skin": "icon-bodyskin",
        "Mesh Head": "icon-meshhead", "Mesh Body": "icon-meshbody", "Accessories": "icon-accessories", "Skybox": "icon-skybox",
        "Houses": "icon-houses", "Decor": "icon-decor", "Objects": "icon-objects", "Textures": "icon-textures", "Scripts": "icon-scripts"
    };

    const catDisplayNames = {
        'icon-clothing': 'CLOTHING', 'icon-hairs': 'HAIRS', 'icon-faceskin': 'FACE SKIN', 'icon-bodyskin': 'BODY SKIN',
        'icon-meshhead': 'MESH HEAD', 'icon-meshbody': 'MESH BODY', 'icon-accessories': 'ACCESSORIES', 'icon-skybox': 'SKYBOX',
        'icon-houses': 'HOUSES', 'icon-decor': 'DECOR', 'icon-objects': 'OBJECTS', 'icon-textures': 'TEXTURES', 'icon-scripts': 'SCRIPTS'
    };

    // Auto-Detector Inteligente de palavras-chave restaurado
    const keywords = {
        'Clothing': ['shirt', 'pants', 'dress', 'jacket', 'top', 'skirt', 'jeans', 'apparel', 'outfit', 'suit', 'hoodie', 'shorts', 'bra', 'lingerie', 'sweater'],
        'Hair': ['hair', 'bangs', 'ponytail', 'braid', 'curls', 'updo', 'wig'],
        'Face Skin': ['makeup', 'face', 'lipstick', 'eyeshadow', 'blush', 'eyebrows', 'lip', 'eye'],
        'Body Skin': ['body skin', 'skin', 'tattoo', 'freckles', 'bom'],
        'Mesh Head': ['head', 'lelutka', 'catwa', 'genus'],
        'Mesh Body': ['body', 'maitreya', 'legacy', 'ebody', 'kupra', 'reborn'],
        'Accessories': ['shoes', 'boots', 'sneakers', 'heels', 'necklace', 'ring', 'piercing', 'bag', 'glasses', 'hat', 'earrings', 'choker'],
        'Skybox': ['skybox', 'backdrop', 'studio', 'surround'],
        'Houses': ['house', 'cabin', 'mansion', 'cottage', 'building'],
        'Decor': ['decor', 'furniture', 'couch', 'bed', 'lamp', 'rug', 'plant', 'chair', 'table', 'sofa'],
        'Objects': ['object', 'prop', 'mesh'],
        'Textures': ['texture', 'map', 'specular', 'normal', 'seamless'],
        'Scripts': ['script', 'lsl', 'hud', 'tool', 'animation', 'pose', 'ao']
    };

    let inventory = [];
    let selectedItem = null;

    function detectCategory(name) {
        const saved = localStorage.getItem("cat_" + name);
        if (saved) return saved;
        
        const lowerName = name.toLowerCase();
        for (const [cat, words] of Object.entries(keywords)) {
            if (words.some(word => lowerName.includes(word))) return cat;
        }
        return 'Objects';
    }

    function getEmptyStateHTML(title, sub) { 
        return `<div class="empty-watermark"><div class="empty-watermark-title">${title}</div><div class="empty-watermark-sub">${sub}</div></div>`; 
    }

    function switchTab(tabId, btnElement){
        document.querySelectorAll('.tab-btn').forEach(btn=>{ btn.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(tab=>{ tab.classList.remove('active'); });
        document.getElementById(`tab-${tabId}`).classList.add('active');
        btnElement.classList.add('active');
        if(tabId === 'categories') closeCategoryView(); 
    }

    function setStatus(text){ document.getElementById("status").innerText = text; }

    async function loadInventory(){
        if(!api){ setStatus("Disconnected: Access via SL Menu."); return; }
        try{
            const res = await fetch(api);
            inventory = await res.json();
            inventory = inventory.map(i => decodeURIComponent(i));
            renderInventory(inventory, "inventory-list", "bulkInv");
        }catch(e){
            setStatus("Connection failed.");
        }
    }

    function renderInventory(items, targetId, bulkId = null){
        const target = document.getElementById(targetId);
        const bulkEl = bulkId ? document.getElementById(bulkId) : null;
        target.innerHTML = "";

        if(items.length === 0){
            if(bulkEl) bulkEl.style.display = 'none';
            target.innerHTML = getEmptyStateHTML("Nothing Found", "No matching folders to display.");
            if(targetId === "inventory-list") setStatus("Total Folders Allocated: 0");
            return;
        }

        if(bulkEl) bulkEl.style.display = 'flex';

        items.forEach(item=>{
            const category = detectCategory(item);
            const icon = categories[category] || "icon-objects";

            const li = document.createElement("li");
            li.className = "item";

            // Sincronizado perfeitamente com todas as funções de escudos e botões duplos
            li.innerHTML = `
            <input type="checkbox" class="item-cb bulk-item" value="${item}">
            <div class="item-name">${item}</div>
            <div class="item-actions">
                <div class="cat-badge" onclick="openCategoryModal('${encodeURIComponent(item)}')">
                    <svg><use href="#${icon}"></use></svg>
                    <div class="cat-tooltip">${catDisplayNames[icon] || 'OBJECTS'}</div>
                </div>
                <button class="action-btn deliver-btn" onclick="deliverItem('${encodeURIComponent(item)}', this)">Deliver</button>
                <button class="action-btn delete-btn" onclick="deleteItem('${encodeURIComponent(item)}', this)">Delete</button>
            </div>`;

            target.appendChild(li);
        });

        if(targetId === "inventory-list") setStatus(`Total Folders Allocated: ${inventory.length}`);
    }

    async function deliverItem(itemEncoded, btn){
        const item = decodeURIComponent(itemEncoded);
        const oldText = btn.innerText; btn.innerText = "Wait..."; btn.disabled = true;
        try{
            const res = await fetch(api, { method:"POST", body:item });
            if(res.ok) { btn.innerText = "Done ✔"; } else { btn.innerText = "Error"; }
        } catch { btn.innerText = "Failed"; }
        setTimeout(()=>{ btn.innerText = oldText; btn.disabled = false; }, 1800);
    }

    async function deleteItem(itemEncoded, btn){
        const item = decodeURIComponent(itemEncoded);
        const oldText = btn.innerText; btn.innerText = "Wait..."; btn.disabled = true;
        try{
            const res = await fetch(api, { method:"POST", body:"MENU_DEL:" + item });
            if(res.ok) { btn.innerText = "Check SL"; } else { btn.innerText = "Error"; }
        } catch { btn.innerText = "Failed"; }
        setTimeout(()=>{ btn.innerText = oldText; btn.disabled = false; }, 4000);
    }

    async function deliverSelected(){
        const checked = [...document.querySelectorAll(".bulk-item:checked")];
        if(!checked.length) return;
        const items = checked.map(c=>c.value).join("\n");
        const btn = document.querySelector(".btn-bulk-deliver");
        const oldText = btn.innerText; btn.innerText = "Wait..."; btn.disabled = true;
        try {
            await fetch(api, { method:"POST", body:items });
            btn.innerText = "Done ✔";
        } catch { btn.innerText = "Failed"; }
        setTimeout(()=>{ btn.innerText = oldText; btn.disabled = false; }, 1800);
    }

    document.getElementById("select-all").addEventListener("change", e=>{
        document.querySelectorAll(".bulk-item").forEach(cb=>{ cb.checked = e.target.checked; });
    });

    function renderCategories(){
        const grid = document.getElementById("cat-grid");
        grid.innerHTML = "";
        Object.entries(categories).forEach(([name,icon])=>{
            const div = document.createElement("div"); div.className = "cat-circle";
            div.innerHTML = `<div class="cat-icon-bg"><svg><use href="#${icon}"></use></svg></div><div class="cat-label">${name}</div>`;
            div.onclick = ()=>openCategory(name);
            grid.appendChild(div);
        });
    }

    function openCategory(category){
        document.getElementById("categories-home").classList.add("hidden");
        document.getElementById("category-view").classList.remove("hidden");
        document.getElementById("catViewTitle").innerText = `📁 CATEGORY: ${category}`;
        const filtered = inventory.filter(item => detectCategory(item) === category);
        renderInventory(filtered, "category-items", "bulkCat");
    }

    function closeCategoryView(){
        document.getElementById("categories-home").classList.remove("hidden");
        document.getElementById("category-view").classList.add("hidden");
    }

    function openCategoryModal(itemEncoded){
        selectedItem = decodeURIComponent(itemEncoded);
        const modal = document.getElementById("category-modal");
        const grid = document.getElementById("modal-grid");
        grid.innerHTML = "";

        Object.entries(categories).forEach(([name,icon])=>{
            const div = document.createElement("div"); div.className = "modal-cat";
            div.innerHTML = `<svg width="22" height="22" style="margin-bottom:8px; fill:#fff;"><use href="#${icon}"></use></svg><br>${name}`;
            div.onclick = ()=>{
                localStorage.setItem("cat_" + selectedItem, name);
                modal.classList.remove("active");
                // Atualiza todas as abas abertas em tempo real
                renderInventory(inventory, "inventory-list", "bulkInv");
                if(!document.getElementById("category-view").classList.contains("hidden")) {
                    const currentCat = document.getElementById("catViewTitle").innerText.replace("📁 CATEGORY: ", "");
                    openCategory(currentCat);
                }
                const searchVal = document.getElementById("search-input").value;
                if(searchVal) searchInventory(searchVal);
            };
            grid.appendChild(div);
        });
        modal.classList.add("active");
    }

    document.getElementById("category-modal").addEventListener("click", e=>{
        if(e.target.id==="category-modal") e.target.classList.remove("active");
    });

    function searchInventory(text){
        if(!text) { document.getElementById("search-results").innerHTML = ""; return; }
        const result = inventory.filter(i=> i.toLowerCase().includes(text.toLowerCase()) );
        renderInventory(result, "search-results", "bulkSearch");
    }

    renderCategories();
    loadInventory();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMC Personal Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #111111;
            --text-main: #f0f0f0;
            --text-dim: #888888;
            --accent: #ffffff;
            --border: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--container-bg);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            padding: 30px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 5px;
        }

        input#searchBar {
            width: 100%;
            padding: 12px 15px;
            background-color: #000;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.9rem;
            border-radius: 4px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }

        input#searchBar:focus {
            border-color: var(--text-dim);
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            transition: background-color 0.2s;
        }

        .item:hover {
            background-color: #151515;
        }

        .item-name {
            font-size: 0.95rem;
            word-break: break-all;
            padding-right: 15px;
        }

        .btn-delivery {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-dim);
            padding: 6px 15px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            white-space: nowrap;
        }

        .btn-delivery:hover {
            background: var(--accent);
            color: #000;
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✦ MMC Personal Manager</h1>
        <div class="subtitle" id="connectionStatus">Connecting to Second Life Server...</div>
    </header>

    <input type="text" id="searchBar" placeholder="Filter your folders..." onkeyup="filterItems()">

    <ul class="item-list" id="inventoryList">
        </ul>

    <div class="status" id="countStatus">Loading data...</div>
</div>

<script>
    // Captura a URL secreta do SL enviada via parâmetro ?api=
    const urlParams = new URLSearchParams(window.location.search);
    const slApiUrl = urlParams.get('api');
    
    let allItems = [];

    async function loadInventory() {
        if (!slApiUrl) {
            document.getElementById('connectionStatus').innerText = "Disconnected: No API Link Provided.";
            document.getElementById('countStatus').innerText = "Please open this page using the server menu in Second Life.";
            return;
        }

        try {
            const response = await fetch(slApiUrl);
            const data = await response.json();
            
            // Decodifica os nomes (O LSL envia "escapado" para evitar quebra de JSON)
            allItems = data.map(item => decodeURIComponent(item));
            
            document.getElementById('connectionStatus').innerText = "🟢 Server Connected Successfully";
            renderList(allItems);
        } catch (error) {
            document.getElementById('connectionStatus').innerText = "🔴 Connection Lost or Expired";
            document.getElementById('countStatus').innerText = "Generate a new link in your Second Life Server.";
        }
    }

    function renderList(items) {
        const listEl = document.getElementById('inventoryList');
        listEl.innerHTML = "";
        
        items.forEach(item => {
            const li = document.createElement('li');
            li.className = 'item';
            
            const span = document.createElement('span');
            span.className = 'item-name';
            span.innerText = item;
            
            const btn = document.createElement('button');
            btn.className = 'btn-delivery';
            btn.innerText = 'Delivery';
            btn.onclick = () => requestDelivery(item, btn);
            
            li.appendChild(span);
            li.appendChild(btn);
            listEl.appendChild(li);
        });

        document.getElementById('countStatus').innerText = `Total Folders: ${items.length}`;
    }

    function filterItems() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const filtered = allItems.filter(item => item.toLowerCase().includes(query));
        renderList(filtered);
    }

    async function requestDelivery(itemName, buttonEl) {
        buttonEl.innerText = "Sending...";
        buttonEl.style.borderColor = "#4CAF50";
        
        try {
            await fetch(slApiUrl, {
                method: 'POST',
                body: itemName
            });
            buttonEl.innerText = "Sent ✔";
            buttonEl.style.background = "#4CAF50";
            buttonEl.style.color = "#000";
            
            setTimeout(() => {
                buttonEl.innerText = "Delivery";
                buttonEl.style.background = "transparent";
                buttonEl.style.color = "var(--text-main)";
                buttonEl.style.borderColor = "var(--text-dim)";
            }, 2000);
        } catch(e) {
            buttonEl.innerText = "Failed";
            buttonEl.style.borderColor = "red";
        }
    }

    // Inicia o processo ao carregar a página
    loadInventory();
</script>

</body>
</html>

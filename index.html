<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --danger:#ff4b4b;
    --green:#4cff9d;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.top-status{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
}

.status-box{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:16px;
    padding:12px 16px;
    min-width:120px;
}

.status-label{
    font-size:.62rem;
    color:#777;
    text-transform:uppercase;
    letter-spacing:1px;
}

.status-value{
    margin-top:6px;
    font-size:.9rem;
    font-weight:700;
}

.online{
    color:var(--green);
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.search-bar{
    margin-bottom:18px;
}

.search-input{
    width:100%;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    padding:16px;
    color:#fff;
    font-size:.9rem;
    outline:none;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    padding:12px 16px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.5px;
    color:#d8d8d8;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk-deliver,
.remote-btn{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.remote-panel{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
}

.remote-btn.danger{
    background:#ff4b4b;
    color:#fff;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.item-btn{
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:10px 12px;
    font-size:.62rem;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:all .2s ease;
}

.deliver-btn{
    background:#fff;
    color:#000;
}

.delete-btn{
    background:#1a1a1a;
    color:#ff5a5a;
    border:1px solid #2f2f2f;
}

.footer-status{
    margin-top:24px;
    text-align:center;
    font-size:.75rem;
    color:#666;
}

.toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    border:1px solid #2b2b2b;
    color:#fff;
    padding:14px 18px;
    border-radius:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
    z-index:999;
    font-size:.75rem;
    letter-spacing:.5px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(-6px);
}

</style>
</head>
<body>

<div class="container">

<header>

<h1>✦ PERSONAL INVENTORY</h1>

<div class="subtitle">
powered by Saori Suki
</div>

<div class="top-status">

<div class="status-box">
<div class="status-label">STATUS</div>
<div class="status-value online" id="statusText">
ONLINE
</div>
</div>

<div class="status-box">
<div class="status-label">FOLDERS</div>
<div class="status-value" id="folderCount">
0
</div>
</div>

<div class="status-box">
<div class="status-label">SERVER</div>
<div class="status-value" id="serverName">
MMC
</div>
</div>

</div>

</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory', this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('tools', this)">
Remote
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="search-bar">
<input
type="text"
class="search-input"
placeholder="Search folders..."
id="searchInput"
onkeyup="filterInventory()"
>
</div>

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" class="item-cb" id="selectAll">
Select All
</label>

<button class="btn-bulk-deliver" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-tools" class="tab-content">

<div class="remote-panel">

<button class="remote-btn" onclick="reloadInventory()">
Refresh Inventory
</button>

<button class="remote-btn danger" onclick="resetServer()">
Reset Script
</button>

</div>

</div>

<div class="footer-status" id="footerStatus">
Connecting to SL API...
</div>

</div>

<div class="toast" id="toast"></div>

<script>

const urlParams = new URLSearchParams(window.location.search);
const apiURL = urlParams.get("api");

let inventoryData = [];
let filteredData = [];

if(!apiURL){
    document.getElementById("footerStatus").innerText = "Missing SL API.";
}else{
    loadInventory();
}

function switchTab(tabId, btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

async function loadInventory(){

    try{

        document.getElementById("footerStatus").innerText = "Loading inventory...";

        const res = await fetch(apiURL);
        const data = await res.json();

        inventoryData = data;
        filteredData = data;

        renderInventory();

        document.getElementById("folderCount").innerText = data.length;

        document.getElementById("footerStatus").innerText =
        "Inventory connected successfully.";

    }catch(e){

        console.error(e);

        document.getElementById("footerStatus").innerText =
        "Connection failed.";

        showToast("Failed to connect.");

    }
}

function renderInventory(){

    const list = document.getElementById("inventory-list");

    list.innerHTML = "";

    if(filteredData.length === 0){

        list.innerHTML = `
        <div style="padding:70px 20px;text-align:center;color:#666;">
            No folders found.
        </div>
        `;

        return;
    }

    filteredData.forEach(item=>{

        const li = document.createElement("li");
        li.className = "item";

        li.innerHTML = `

        <input type="checkbox" class="item-cb folder-check" value="${escapeHtml(item)}">

        <div class="item-name">${escapeHtml(item)}</div>

        <div class="item-actions">

            <button
            class="item-btn deliver-btn"
            onclick="deliverItem('${escapeJs(item)}', this)">
            Deliver
            </button>

            <button
            class="item-btn delete-btn"
            onclick="deleteItem('${escapeJs(item)}', this)">
            Delete
            </button>

        </div>
        `;

        list.appendChild(li);

    });

}

function filterInventory(){

    const q = document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    filteredData = inventoryData.filter(item=>
        item.toLowerCase().includes(q)
    );

    renderInventory();
}

async function deliverItem(item, btn){

    const old = btn.innerText;

    btn.innerText = "WAIT...";
    btn.disabled = true;

    try{

        const res = await fetch(apiURL,{
            method:"POST",
            body:item
        });

        if(res.ok){

            btn.innerText = "DONE ✓";

            showToast("Delivered: " + item);

        }else{

            btn.innerText = "ERROR";

        }

    }catch(e){

        btn.innerText = "ERROR";

    }

    setTimeout(()=>{
        btn.innerText = old;
        btn.disabled = false;
    },2000);
}

async function deleteItem(item, btn){

    const old = btn.innerText;

    btn.innerText = "WAIT...";
    btn.disabled = true;

    try{

        const res = await fetch(apiURL,{
            method:"POST",
            body:"MENU_DEL:" + item
        });

        if(res.ok){

            btn.innerText = "CHECK SL";

            showToast("Confirm deletion in Second Life.");

        }else{

            btn.innerText = "ERROR";

        }

    }catch(e){

        btn.innerText = "ERROR";

    }

    setTimeout(()=>{
        btn.innerText = old;
        btn.disabled = false;
    },3000);
}

async function deliverSelected(){

    const checks = document.querySelectorAll(".folder-check:checked");

    if(checks.length === 0){
        showToast("No folders selected.");
        return;
    }

    const names = [];

    checks.forEach(c=>{
        names.push(c.value);
    });

    try{

        await fetch(apiURL,{
            method:"POST",
            body:names.join("\n")
        });

        showToast("Bulk delivery completed.");

    }catch(e){

        showToast("Bulk delivery failed.");

    }
}

async function resetServer(){

    if(!confirm("Reset script?")) return;

    try{

        await fetch(apiURL,{
            method:"POST",
            body:"CMD:RESET"
        });

        showToast("Server reset executed.");

    }catch(e){

        showToast("Reset failed.");

    }
}

function reloadInventory(){
    loadInventory();
    showToast("Refreshing inventory...");
}

document.getElementById("selectAll")
.addEventListener("change",function(){

    document.querySelectorAll(".folder-check")
    .forEach(cb=>{
        cb.checked = this.checked;
    });

});

function showToast(msg){

    const toast = document.getElementById("toast");

    toast.innerText = msg;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2500);
}

function escapeHtml(text){
    return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function escapeJs(text){
    return text
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

</script>

</body>
</html>

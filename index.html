<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#060606;
    --panel:#0f0f0f;
    --panel-2:#131313;

    --line:#202020;
    --line-soft:#171717;

    --text:#f5f5f5;
    --text-soft:#b5b5b5;
    --text-dim:#747474;

    --danger:#ff4b4b;

    --radius:24px;
    --radius-soft:18px;

    --transition:all .22s ease;

    --shadow:
        0 20px 60px rgba(0,0,0,.55);

    --shadow-hover:
        0 25px 70px rgba(0,0,0,.7);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 35%),
        linear-gradient(to bottom,#080808,#040404);

    color:var(--text);

    font-family:'Inter',sans-serif;

    display:flex;
    justify-content:center;

    padding:40px 20px;

    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;

    background:
        linear-gradient(180deg,#101010,#0a0a0a);

    border:1px solid var(--line);

    border-radius:32px;

    padding:34px;

    box-shadow:var(--shadow);

    position:relative;

    overflow:hidden;
}

.container::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(180deg,rgba(255,255,255,.03),transparent 15%);

    pointer-events:none;
}

header{
    text-align:center;
    padding-bottom:26px;
    border-bottom:1px solid var(--line-soft);
}

h1{
    margin:0;

    font-size:1.15rem;
    font-weight:800;

    letter-spacing:4px;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;

    color:var(--text-dim);

    font-size:.78rem;
    font-weight:500;

    letter-spacing:1px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:12px;

    margin:26px 0 30px;
}

.tab-btn{
    border:none;

    background:
        linear-gradient(180deg,#151515,#101010);

    border:1px solid #1f1f1f;

    color:#858585;

    padding:11px 18px;

    border-radius:999px;

    font-size:.7rem;
    font-weight:700;

    letter-spacing:1.5px;
    text-transform:uppercase;

    cursor:pointer;

    transition:var(--transition);
}

.tab-btn:hover{
    transform:translateY(-2px);

    color:white;

    border-color:#3a3a3a;
}

.tab-btn.active{
    background:white;
    color:black;

    border-color:white;

    box-shadow:
        0 8px 22px rgba(255,255,255,.12);
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.cat-grid{
    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));

    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:14px;

    cursor:pointer;

    transition:var(--transition);

    opacity:.78;
}

.cat-circle:hover{
    opacity:1;
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;

    border-radius:30px;

    background:
        linear-gradient(180deg,#181818,#0d0d0d);

    border:1px solid #262626;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:var(--transition);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 10px 30px rgba(0,0,0,.4);
}

.cat-circle:hover .cat-icon-bg{
    border-color:#404040;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 18px 40px rgba(0,0,0,.65);
}

.cat-icon-bg svg{
    width:40px;
    height:40px;

    fill:#e8e8e8;

    transition:var(--transition);
}

.cat-circle:hover svg{
    transform:scale(1.05);
}

.cat-label{
    font-size:.68rem;
    font-weight:700;

    letter-spacing:1.8px;
    text-transform:uppercase;

    color:#8a8a8a;

    text-align:center;
}

.item-list{
    list-style:none;

    padding:0;
    margin:0;

    background:
        linear-gradient(180deg,#0f0f0f,#090909);

    border:1px solid var(--line);

    border-radius:24px;

    overflow:hidden;

    box-shadow:var(--shadow);
}

.item{
    display:grid;

    grid-template-columns:auto 1fr auto;

    align-items:center;

    gap:18px;

    padding:18px 20px;

    border-bottom:1px solid rgba(255,255,255,.03);

    transition:var(--transition);
}

.item:hover{
    background:rgba(255,255,255,.02);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.9rem;

    font-weight:500;

    color:white;

    line-height:1.45;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.cat-badge{
    width:36px;
    height:36px;

    border-radius:12px;

    background:#050505;

    border:1px solid #2a2a2a;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:var(--transition);
}

.cat-badge:hover{
    border-color:#555;
}

.cat-badge svg{
    width:16px;
    height:16px;

    fill:white;
}

.btn-action{
    border:none;

    background:
        linear-gradient(180deg,#171717,#111111);

    border:1px solid #303030;

    color:white;

    padding:9px 14px;

    border-radius:12px;

    font-size:.66rem;
    font-weight:800;

    letter-spacing:1px;
    text-transform:uppercase;

    cursor:pointer;

    transition:var(--transition);
}

.btn-action:hover{
    transform:translateY(-1px);

    border-color:#555;
}

.btn-delete{
    border-color:#3b1d1d;
    color:var(--danger);
}

.btn-delete:hover{
    border-color:var(--danger);
}

.bulk-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;

    padding:14px 16px;

    border-radius:18px;

    background:
        linear-gradient(180deg,#111111,#0b0b0b);

    border:1px solid var(--line);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.02);
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:.76rem;
    font-weight:600;

    color:#d0d0d0;
}

.item-cb{
    width:16px;
    height:16px;

    accent-color:white;

    cursor:pointer;
}

.btn-bulk-deliver{
    border:none;

    background:white;

    color:black;

    padding:10px 16px;

    border-radius:12px;

    font-size:.65rem;
    font-weight:800;

    letter-spacing:1px;
    text-transform:uppercase;

    cursor:pointer;

    transition:var(--transition);
}

.btn-bulk-deliver:hover{
    transform:translateY(-1px);
}

input[type="text"]{
    width:100%;

    background:
        linear-gradient(180deg,#101010,#0a0a0a);

    border:1px solid #252525;

    color:white;

    padding:16px 18px;

    border-radius:18px;

    outline:none;

    font-size:.9rem;

    margin-bottom:20px;

    transition:var(--transition);
}

input[type="text"]:focus{
    border-color:#4d4d4d;
}

.settings-group{
    background:
        linear-gradient(180deg,#121212,#0d0d0d);

    border:1px solid var(--line);

    border-radius:24px;

    padding:28px;

    text-align:center;
}

.settings-label{
    color:#bcbcbc;

    line-height:1.7;

    font-size:.84rem;
}

.btn-panel{
    width:100%;

    margin-top:18px;

    border:none;

    background:
        linear-gradient(180deg,#181818,#111111);

    border:1px solid #303030;

    color:white;

    padding:14px;

    border-radius:16px;

    font-size:.72rem;
    font-weight:700;

    letter-spacing:1px;
    text-transform:uppercase;

    cursor:pointer;

    transition:var(--transition);
}

.btn-panel:hover{
    border-color:#555;
}

.footer-status{
    margin-top:26px;

    text-align:center;

    color:#777;

    font-size:.74rem;

    letter-spacing:1px;
}

.empty-watermark{
    text-align:center;

    padding:80px 20px;
}

.empty-watermark-title{
    font-size:1rem;
    font-weight:700;

    letter-spacing:2px;
    text-transform:uppercase;

    color:white;

    margin-bottom:10px;
}

.empty-watermark-sub{
    color:#777;

    font-size:.85rem;
}

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.8);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.modal-content{
    width:90%;
    max-width:520px;

    background:
        linear-gradient(180deg,#131313,#0b0b0b);

    border:1px solid #222;

    border-radius:28px;

    padding:28px;

    box-shadow:var(--shadow-hover);
}

.cat-selector-grid{
    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(90px,1fr));

    gap:18px;

    margin-top:22px;
}

.cat-badge-large{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:10px;

    cursor:pointer;

    transition:var(--transition);
}

.cat-badge-large:hover{
    transform:translateY(-3px);
}

.icon-box{
    width:58px;
    height:58px;

    border-radius:18px;

    background:
        linear-gradient(180deg,#181818,#0d0d0d);

    border:1px solid #2b2b2b;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:var(--transition);
}

.cat-badge-large:hover .icon-box{
    border-color:#555;
}

.icon-box svg{
    width:24px;
    height:24px;

    fill:#fff;
}

.cat-badge-large span{
    font-size:.63rem;

    color:#8a8a8a;

    font-weight:700;

    letter-spacing:1px;
    text-transform:uppercase;
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>✦ PERSONAL INVENTORY</h1>
    <div class="subtitle">powered by Saori Suki</div>
</header>

<div class="tabs">
    <button class="tab-btn active">Inventory</button>
    <button class="tab-btn">Categories</button>
    <button class="tab-btn">Search By</button>
    <button class="tab-btn">Manage</button>
    <button class="tab-btn">Config</button>
</div>

<div class="cat-grid">

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<path d="M12.87 3.14a4 4 0 00-1.74 0L4 6v2h2v11a1 1 0 001 1h10a1 1 0 001-1V8h2V6l-7.13-2.86z"/>
</svg>
</div>
<div class="cat-label">Clothing</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<path d="M12 2C7 2 3 6 3 11v2c0 1.5 1 2.7 2.4 3C5.8 20 8.5 22 12 22s6.2-2 6.6-6c1.4-.3 2.4-1.5 2.4-3v-2c0-5-4-9-9-9z"/>
</svg>
</div>
<div class="cat-label">Hairs</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<path d="M12 2C9.8 2 8 3.8 8 6c0 1.5.8 2.7 2 3.4V11H8.5C6.6 11 5 12.6 5 14.5V19c0 .6.4 1 1 1h2v-4h1v4h6v-4h1v4h2c.6 0 1-.4 1-1v-4.5c0-1.9-1.6-3.5-3.5-3.5H14V9.4c1.2-.7 2-1.9 2-3.4 0-2.2-1.8-4-4-4z"/>
</svg>
</div>
<div class="cat-label">Body Skin</div>
</div>

</div>

<div style="height:26px"></div>

<div class="bulk-actions">
<label class="checkbox-label">
<input type="checkbox" class="item-cb">
Select All
</label>

<button class="btn-bulk-deliver">
Deliver Selected
</button>
</div>

<ul class="item-list">

<li class="item">

<div class="cat-badge">
<svg viewBox="0 0 24 24">
<path d="M12.87 3.14a4 4 0 00-1.74 0L4 6v2h2v11a1 1 0 001 1h10a1 1 0 001-1V8h2V6l-7.13-2.86z"/>
</svg>
</div>

<div class="item-name">
[MMC] Luxury Outfit Collection 2026
</div>

<div class="item-actions">
<button class="btn-action">Deliver</button>
<button class="btn-action btn-delete">Delete</button>
</div>

</li>

<li class="item">

<div class="cat-badge">
<svg viewBox="0 0 24 24">
<path d="M12 2C7 2 3 6 3 11v2c0 1.5 1 2.7 2.4 3C5.8 20 8.5 22 12 22s6.2-2 6.6-6c1.4-.3 2.4-1.5 2.4-3v-2c0-5-4-9-9-9z"/>
</svg>
</div>

<div class="item-name">
TRUTH Hairpack — Blonde Collection
</div>

<div class="item-actions">
<button class="btn-action">Deliver</button>
<button class="btn-action btn-delete">Delete</button>
</div>

</li>

</ul>

<div class="footer-status">
Total Folders Allocated: 284
</div>

</div>

</body>
</html>

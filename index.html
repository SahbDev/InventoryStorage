<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --danger:#ff4b4b;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.top-actions{
    margin-top:22px;
    display:flex;
    justify-content:center;
    gap:12px;
}

.top-btn{
    background:linear-gradient(180deg,#181818,#101010);
    border:1px solid #262626;
    color:#d7d7d7;
    padding:11px 18px;
    border-radius:14px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    transition:var(--transition);
    text-transform:uppercase;
}

.top-btn:hover{
    border-color:#4d4d4d;
    transform:translateY(-2px);
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    padding:12px 16px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.5px;
    color:#d8d8d8;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk-deliver{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:var(--transition);
}

.cat-circle:hover{
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;
    border-radius:26px;
    background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:var(--transition);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 18px 35px rgba(0,0,0,.45);
}

.cat-circle:hover .cat-icon-bg{
    border-color:#4e4e4e;
}

.cat-icon-bg svg{
    width:32px;
    height:32px;
    stroke:white;
    stroke-width:1.7;
    fill:none;
}

.cat-label{
    font-size:.65rem;
    letter-spacing:1.4px;
    font-weight:700;
    text-transform:uppercase;
    color:#9c9c9c;
    text-align:center;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.action-btn{
    width:38px;
    height:38px;
    border-radius:14px;
    border:1px solid #292929;
    background:#070707;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:all .2s ease;
}

.action-btn:hover{
    border-color:#555;
    transform:translateY(-1px);
}

.action-btn svg{
    width:16px;
    height:16px;
    stroke:white;
    stroke-width:2;
    fill:none;
}

.empty-watermark{
    padding:80px 20px;
    text-align:center;
}

.empty-watermark-title{
    font-size:1rem;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:10px;
}

.empty-watermark-sub{
    color:#666;
}

.search-box{
    width:100%;
    background:#0e0e0e;
    border:1px solid #222;
    border-radius:18px;
    padding:16px;
    color:white;
    outline:none;
    margin-bottom:18px;
    font-size:.9rem;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:#101010;
    border:1px solid #272727;
    border-radius:28px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.modal-title{
    font-size:1rem;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:18px;
}

.modal-text{
    color:#9f9f9f;
    line-height:1.7;
    font-size:.9rem;
}

.modal-actions{
    margin-top:26px;
    display:flex;
    gap:12px;
}

.modal-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.modal-delete{
    background:#fff;
    color:#000;
}

.modal-cancel{
    background:#1a1a1a;
    color:#fff;
    border:1px solid #303030;
}

</style>
</head>
<body>

<div class="container">

<header>

<h1>✦ PERSONAL INVENTORY</h1>

<div class="subtitle">
powered by Saori Suki
</div>

<div class="top-actions">

<button class="top-btn" onclick="resyncInventory()">
Resync
</button>

</div>

</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory', this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories', this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('search', this)">
Search
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" class="item-cb" id="selectAll">
Select All
</label>

<button class="btn-bulk-deliver" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-categories" class="tab-content">

<div class="cat-grid">

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<path d="M7 4l5 3 5-3"></path>
<path d="M7 4v6l5 3 5-3V4"></path>
<path d="M7 10l-3 2v7l8 4 8-4v-7l-3-2"></path>
</svg>
</div>
<div class="cat-label">Clothing</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<path d="M6 9c1-4 4-6 6-6s5 2 6 6"></path>
<path d="M5 10c0 6 3 10 7 10s7-4 7-10"></path>
</svg>
</div>
<div class="cat-label">Hair</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="7"></circle>
<path d="M9 11h.01"></path>
<path d="M15 11h.01"></path>
<path d="M10 15c1 .8 3 .8 4 0"></path>
</svg>
</div>
<div class="cat-label">Mesh Head</div>
</div>

<div class="cat-circle">
<div class="cat-icon-bg">
<svg viewBox="0 0 24 24">
<path d="M12 3v18"></path>
<path d="M7 8c0-3 2-5 5-5s5 2 5 5"></path>
<path d="M6 21v-5c0-2 2-4 6-4s6 2 6 4v5"></path>
</svg>
</div>
<div class="cat-label">Mesh Body</div>
</div>

</div>

</div>

<div id="tab-search" class="tab-content">

<input
type="text"
class="search-box"
placeholder="Search folders..."
oninput="filterInventory(this.value)"
>

<div class="empty-watermark">

<div class="empty-watermark-title">
Smart Search
</div>

<div class="empty-watermark-sub">
Search instantly through your storage system.
</div>

</div>

</div>

</div>

<div class="modal" id="deleteModal">

<div class="modal-box">

<div class="modal-title">
CAUTION
</div>

<div class="modal-text" id="deleteText">
This action will permanently remove this folder from the server contents.
</div>

<div class="modal-actions">

<button class="modal-btn modal-cancel" onclick="closeDeleteModal()">
Cancel
</button>

<button class="modal-btn modal-delete" onclick="confirmDelete()">
Delete Permanently
</button>

</div>

</div>

</div>

<script>

const API_URL = new URLSearchParams(window.location.search).get("api");

let inventoryData = [];
let deleteTarget = null;

function switchTab(tabId, btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

async function fetchInventory(){

    if(!API_URL) return;

    try{

        const response = await fetch(API_URL);

        inventoryData = await response.json();

        renderInventory(inventoryData);

    }catch(err){

        console.error(err);

    }
}

function renderInventory(items){

    const list = document.getElementById("inventory-list");

    list.innerHTML = "";

    items.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `
        
        <input type="checkbox" class="item-cb" value="${item}">

        <div class="item-name">${decodeURIComponent(item)}</div>

        <div class="item-actions">

            <button class="action-btn" onclick="deliverItem('${item}')">

                <svg viewBox="0 0 24 24">
                    <path d="M22 2L11 13"></path>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                </svg>

            </button>

            <button class="action-btn" onclick="openDeleteModal('${item}')">

                <svg viewBox="0 0 24 24">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6l-1 14H6L5 6"></path>
                </svg>

            </button>

        </div>
        
        `;

        list.appendChild(li);

    });
}

async function deliverItem(item){

    await fetch(API_URL,{
        method:"POST",
        body:item
    });

}

async function deliverSelected(){

    const checked = [...document.querySelectorAll(".item-cb:checked")]
    .map(cb=>cb.value)
    .filter(Boolean);

    if(!checked.length) return;

    await fetch(API_URL,{
        method:"POST",
        body:checked.join("\n")
    });

}

function openDeleteModal(item){

    deleteTarget = item;

    document.getElementById("deleteText").innerHTML =
    `This action will permanently remove <b>${decodeURIComponent(item)}</b> from the server contents.<br><br>This cannot be undone.`;

    document.getElementById("deleteModal").style.display = "flex";
}

function closeDeleteModal(){

    document.getElementById("deleteModal").style.display = "none";

    deleteTarget = null;
}

async function confirmDelete(){

    if(!deleteTarget) return;

    await fetch(API_URL,{
        method:"POST",
        body:"MENU_DEL:"+deleteTarget
    });

    closeDeleteModal();

    setTimeout(fetchInventory,1000);
}

function filterInventory(query){

    query = query.toLowerCase();

    const filtered = inventoryData.filter(item =>
        decodeURIComponent(item).toLowerCase().includes(query)
    );

    renderInventory(filtered);
}

function resyncInventory(){

    fetchInventory();
}

document.getElementById("selectAll").addEventListener("change",function(){

    document.querySelectorAll(".item-cb").forEach(cb=>{
        cb.checked = this.checked;
    });

});

fetchInventory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --green:#52ff9c;
    --danger:#ff4b4b;
    --accent-purple:#cfa3ff;
    --transition:all .22s ease;
}

*{ box-sizing:border-box; }

body{
    margin:0; padding:40px 18px;
    background: radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%), #060606;
    font-family:'Inter',sans-serif; color:var(--text);
    display:flex; justify-content:center; min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%; max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line); border-radius:34px; padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65); display: flex; flex-direction: column;
}

header{ text-align:center; padding-bottom:24px; border-bottom:1px solid #1b1b1b; position:relative; }

.header-actions { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; }

.status-badge{
    background:#0f0f0f; border:1px solid #2a2a2a; padding:8px 12px; border-radius:999px;
    display:flex; align-items:center; gap:8px; font-size:.65rem; font-weight:700; letter-spacing:1px;
}
.status-dot{ width:8px; height:8px; border-radius:999px; background:var(--green); box-shadow:0 0 10px var(--green); }

.resync-btn {
    background:#0f0f0f; border:1px solid #2a2a2a; color: var(--text); padding:8px 14px; border-radius:999px;
    display:flex; align-items:center; gap:6px; font-size:.65rem; font-weight:700; letter-spacing:1px;
    cursor: pointer; transition: var(--transition);
}
.resync-btn:hover { border-color: #555; transform: translateY(-1px); }
.resync-btn svg { width: 14px; height: 14px; fill: #fff; }

h1{ margin:30px 0 0 0; font-size:1.05rem; letter-spacing:4px; font-weight:800; text-transform:uppercase; }
.subtitle{ margin-top:12px; color:var(--dim); font-size:.78rem; letter-spacing:1px; }
.subtitle a { color: inherit; text-decoration: none; font-weight: 700; transition: var(--transition); }
.subtitle a:hover { color: var(--text); text-shadow: 0 0 8px rgba(255,255,255,0.2); }

.top-stats{ display:flex; justify-content:center; gap:14px; margin-top:22px; flex-wrap:wrap; }
.stat-card{ background:#0d0d0d; border:1px solid #202020; border-radius:18px; padding:14px 18px; min-width:120px; text-align: center; }
.stat-label{ color:#777; font-size:.62rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
.stat-value{ font-size:1rem; font-weight:700; }

.tabs{ display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin:26px 0; }
.tab-btn{
    background:linear-gradient(180deg,#181818,#111111); border:1px solid #262626; color:#8d8d8d;
    padding:12px 18px; border-radius:999px; cursor:pointer; transition:var(--transition);
    font-size:.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; outline: none;
}
.tab-btn:hover{ transform:translateY(-2px); color:#fff; border-color:#4a4a4a; }
.tab-btn.active{ background:#fff; color:#000; border-color:#fff; }

.tab-content{ display:none; }
.tab-content.active{ display:block; }

.search-box{ width:100%; margin-bottom:18px; }
.search-input{
    width:100%; background:#0c0c0c; border:1px solid #242424; color:#fff;
    padding:18px 20px; border-radius:18px; outline:none; font-size:.9rem; text-align: center;
}
.search-input:focus{ border-color:#444; }

.bulk-actions{
    display:flex; justify-content:center; align-items:center; gap:20px;
    background:#0c0c0c; border:1px solid #232323; border-radius:18px;
    padding:12px 20px; margin: 0 auto 18px auto; width: max-content;
}
.checkbox-label{ display:flex; align-items:center; gap:8px; font-size:.68rem; font-weight:700; letter-spacing:.5px; color:#d8d8d8; cursor:pointer;}
.item-cb{ accent-color:#fff; cursor: pointer; }

.btn{
    border:none; padding:8px 14px; border-radius:12px; cursor:pointer; font-size:.62rem;
    font-weight:800; text-transform:uppercase; letter-spacing:1px; transition:.2s;
}
.btn-white{ background:#fff; color:#000; }
.btn-dark{ background:#110505; color:var(--danger); border:1px solid #381818; }
.btn:hover{ transform:translateY(-1px); }

.cat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(105px,1fr)); gap:24px; }
.cat-circle{ display:flex; flex-direction:column; align-items:center; gap:14px; cursor:pointer; transition:var(--transition); }
.cat-circle:hover{ transform:translateY(-4px); }
.cat-icon-bg{
    width:88px; height:88px; border-radius:26px; background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626; display:flex; justify-content:center; align-items:center;
    transition:var(--transition); box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 18px 35px rgba(0,0,0,.45);
}
.cat-circle:hover .cat-icon-bg{ border-color:#4e4e4e; }
.cat-icon-bg svg{ width:38px; height:38px; fill:#f3f3f3; transition: .3s;}
.cat-circle:hover .cat-icon-bg svg{ fill: #fff; }
.cat-label{ font-size:.65rem; letter-spacing:1.4px; font-weight:700; text-transform:uppercase; color:#9c9c9c; text-align:center; }
.cat-circle:hover .cat-label { color:#ffffff; }

.cat-view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #202020; }
.cat-view-title { font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.btn-back {
    background: #111; color: #888; border: 1px solid #262626; padding: 8px 14px;
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; cursor: pointer; border-radius: 20px; transition: var(--transition);
}
.btn-back:hover { border-color: #fff; color: #fff; }

#catGridView { display: block; }
#catListViewContainer { display: none; }

.item-list{
    list-style:none; margin:0; padding:0; border-radius:24px; overflow:hidden;
    border:1px solid #202020; background:#0c0c0c; max-height:450px; overflow-y:auto;
}
.item-list::-webkit-scrollbar { width: 6px; }
.item-list::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
.item{ display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,.03); transition:.2s; }
.item:hover{ background:#111; }
.item:last-child{ border-bottom:none; }

.item-name-wrapper { position: relative; width: max-content; display: flex; align-items: center; cursor: default; }
.item-name{ font-size:.88rem; font-weight:500; word-break:break-word; line-height: 1.4; transition: color 0.2s;}
.item:has(.item-select:checked) .item-name { color: var(--accent-purple); text-shadow: 0 0 8px rgba(207, 163, 255, 0.2); }

.item-actions{ display:flex; align-items:center; gap:8px; }

.cat-badge{
    width:38px; height:38px; border-radius:14px; border:1px solid #292929;
    background:#070707; display:flex; justify-content:center; align-items:center;
    cursor:pointer; transition:all .2s ease; position:relative;
}
.cat-badge:hover{ border-color:#555; transform:translateY(-1px); }
.cat-badge svg{ width:16px; height:16px; fill:#fff; }

.cat-tooltip{
    position:absolute; bottom:-34px; left:50%; transform:translateX(-50%);
    background:#fff; color:#000; font-size:.55rem; font-weight:800;
    padding:6px 8px; border-radius:8px; letter-spacing:1px; opacity:0;
    pointer-events:none; transition:.18s; white-space:nowrap; text-transform:uppercase; z-index:20;
}
.cat-badge:hover .cat-tooltip, .action-btn:hover .cat-tooltip, .item-name-wrapper:hover .cat-tooltip { opacity:1; bottom:-30px; }

.date-tooltip { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px); left: 0 !important; transform: none !important; }

.action-btn{
    width:38px; height:38px; border-radius:14px; border:1px solid #292929;
    background:#070707; color:#fff; display:flex; justify-content:center; align-items:center;
    cursor:pointer; transition:all .2s ease; position:relative;
}
.action-btn svg { width: 18px; height: 18px; fill: currentColor; }
.action-btn:hover{ border-color:#555; transform:translateY(-1px); }
.action-btn.delete-btn { color: var(--danger); border-color: #381818; background: #110505;}
.action-btn.delete-btn:hover { border-color: var(--danger); background: var(--danger); color: #fff; }

.settings-group { background: #0c0c0c; border: 1px solid #202020; padding: 24px; border-radius: 24px; text-align: center; }
.settings-label { font-size: 0.82rem; margin-bottom: 16px; color: var(--soft); line-height: 1.4; }

.empty-watermark{ padding:80px 20px; text-align:center; }
.empty-watermark-title{ font-size:1rem; font-weight:700; letter-spacing:2px; margin-bottom:10px; text-transform: uppercase; }
.empty-watermark-sub{ color:#666; font-size: 0.85rem; line-height: 1.5;}

.footer-status{ margin-top:55px; text-align:center; font-size:.75rem; color:#555; }

.toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:#111; border:1px solid #2a2a2a; color:#fff;
    padding:14px 18px; border-radius:16px; opacity:0; pointer-events:none;
    transition:all .3s ease; z-index:999; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
}
.toast.show{ opacity:1; bottom:40px; }
.hidden { display: none !important; }

/* Modals */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
.modal.active { display: flex; }
.modal-box { width: 95%; max-width: 420px; background: #0e0e0e; border: 1px solid #252525; border-radius: 28px; padding: 24px; }
.modal-title { font-size: .95rem; font-weight: 700; margin-bottom: 18px; text-align: center; text-transform: uppercase; letter-spacing: 1px; color: #fff;}
.modal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-height: 280px; overflow-y: auto; padding: 4px; }
.modal-cat { background: #141414; border: 1px solid #262626; border-radius: 18px; padding: 16px 10px; cursor: pointer; text-align: center; font-size: .65rem; font-weight: 700; text-transform: uppercase; color: #888; transition: .2s;}
.modal-cat:hover { border-color: #fff; background: #1a1a1a; color: #fff; }
.modal-cat svg { width: 22px; height: 22px; margin-bottom: 8px; fill: #888; transition: .2s;}
.modal-cat:hover svg { fill: #fff; }
</style>
</head>

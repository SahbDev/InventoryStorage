<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --danger:#ff4b4b;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:16px;
    padding:10px 14px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:.63rem;
    font-weight:700;
    letter-spacing:.7px;
    color:#d8d8d8;
    text-transform:uppercase;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk-deliver{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:var(--transition);
}

.cat-circle:hover{
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;
    border-radius:26px;
    background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:var(--transition);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 18px 35px rgba(0,0,0,.45);
}

.cat-circle:hover .cat-icon-bg{
    border-color:#4e4e4e;
}

.cat-icon-bg svg{
    width:42px;
    height:42px;
    fill:#f3f3f3;
}

.cat-label{
    font-size:.65rem;
    letter-spacing:1.4px;
    font-weight:700;
    text-transform:uppercase;
    color:#9c9c9c;
    text-align:center;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.cat-badge{
    width:38px;
    height:38px;
    border-radius:14px;
    border:1px solid #292929;
    background:#070707;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
}

.cat-badge:hover{
    border-color:#555;
    transform:translateY(-1px);
}

.cat-badge svg{
    width:16px;
    height:16px;
    fill:#fff;
}

.action-btn{
    border:none;
    border-radius:12px;
    padding:10px 12px;
    font-size:.62rem;
    font-weight:800;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:var(--transition);
}

.deliver-btn{
    background:#fff;
    color:#000;
}

.delete-btn{
    background:#1a1a1a;
    color:#ff5d5d;
    border:1px solid #2f2f2f;
}

.action-btn:hover{
    transform:translateY(-2px);
}

.empty-watermark{
    padding:80px 20px;
    text-align:center;
}

.empty-watermark-title{
    font-size:1rem;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:10px;
}

.empty-watermark-sub{
    color:#666;
}

.footer-status{
    margin-top:24px;
    text-align:center;
    font-size:.75rem;
    color:#666;
}

.search-box{
    width:100%;
    background:#0d0d0d;
    border:1px solid #242424;
    color:#fff;
    border-radius:18px;
    padding:16px 18px;
    outline:none;
    font-size:.85rem;
}

.hidden{
    display:none !important;
}

.back-btn{
    background:#fff;
    color:#000;
    border:none;
    padding:12px 18px;
    border-radius:14px;
    cursor:pointer;
    margin-bottom:20px;
    font-weight:700;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:95%;
    max-width:420px;
    background:#0e0e0e;
    border:1px solid #252525;
    border-radius:28px;
    padding:24px;
}

.modal-title{
    font-size:.95rem;
    font-weight:700;
    margin-bottom:18px;
}

.modal-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.modal-cat{
    background:#141414;
    border:1px solid #262626;
    border-radius:18px;
    padding:16px 10px;
    cursor:pointer;
    text-align:center;
    font-size:.68rem;
    font-weight:700;
}

.modal-cat:hover{
    border-color:#555;
}

</style>
</head>
<body>

<svg style="display:none;">

<symbol id="icon-clothing" viewBox="0 0 24 24">
<path d="M12 3l4 3 3-1 2 4-3 2v8H6v-8L3 9l2-4 3 1z"/>
</symbol>

<symbol id="icon-hairs" viewBox="0 0 24 24">
<path d="M12 2C7.5 2 4 5.5 4 10v2c0 5.2 3.2 10 8 10s8-4.8 8-10v-2c0-4.5-3.5-8-8-8zm-5 9c1.4-.5 3.2-1.8 4.5-3.8 1.4 2.6 4.2 4.2 7 4.7V13c0 4-2.4 7-6.5 7S5.5 17 5.5 13V11zm12-1.5c-3.4-.7-6-3-6.9-5.8-1.2 2.2-3.6 4.5-6.1 5.4C6.4 5.8 8.8 4 12 4c4 0 7 2.5 7 5.5z"/>
</symbol>

<symbol id="icon-faceskin" viewBox="0 0 24 24">
<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-4 7a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm8 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm-4 8c-2 0-3.7-1-4.5-2.5h9C15.7 16 14 17 12 17z"/>
</symbol>

<symbol id="icon-bodyskin" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 013 3v2h2c1.7 0 3 1.3 3 3v9h-3v-5h-2v5H9v-5H7v5H4v-9c0-1.7 1.3-3 3-3h2V5a3 3 0 013-3z"/>
</symbol>

<symbol id="icon-meshhead" viewBox="0 0 24 24">
<path d="M12 2C7 2 4 6 4 11v2c0 5 3 9 8 9s8-4 8-9v-2c0-5-3-9-8-9z"/>
</symbol>

<symbol id="icon-meshbody" viewBox="0 0 24 24">
<path d="M12 2a4 4 0 100 8 4 4 0 000-8zm0 10c-4 0-7 2-7 5v3h14v-3c0-3-3-5-7-5z"/>
</symbol>

<symbol id="icon-accessories" viewBox="0 0 24 24">
<path d="M12 2l9 7-9 13L3 9l9-7z"/>
</symbol>

<symbol id="icon-skybox" viewBox="0 0 24 24">
<path d="M12 3l5 4v3h2v2h-2v3H7v-3H5v-2h2V7l5-4z"/>
<path d="M4 17c2.5-2 5.5-2 8 0 2.5-2 5.5-2 8 0-1 2.5-3.5 4-8 4s-7-1.5-8-4z"/>
</symbol>

<symbol id="icon-houses" viewBox="0 0 24 24">
<path d="M12 3L3 11h3v9h12v-9h3z"/>
</symbol>

<symbol id="icon-decor" viewBox="0 0 24 24">
<path d="M4 10h16v8H4zM7 6h10v2H7z"/>
</symbol>

<symbol id="icon-objects" viewBox="0 0 24 24">
<path d="M12 2l8 4v12l-8 4-8-4V6z"/>
</symbol>

<symbol id="icon-textures" viewBox="0 0 24 24">
<path d="M3 3h18v18H3z"/>
</symbol>

<symbol id="icon-scripts" viewBox="0 0 24 24">
<path d="M8 6L2 12l6 6 2-2-4-4 4-4zm8 0l-2 2 4 4-4 4 2 2 6-6z"/>
</symbol>

</svg>

<div class="container">

<header>
<h1>✦ PERSONAL INVENTORY</h1>
<div class="subtitle">powered by Saori Suki</div>
</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory', this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories', this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('search', this)">
Search
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" id="select-all">
Select All
</label>

<button class="btn-bulk-deliver" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-categories" class="tab-content">

<div id="categories-home">

<div class="cat-grid" id="cat-grid"></div>

</div>

<div id="category-view" class="hidden">

<button class="back-btn" onclick="closeCategoryView()">← Back</button>

<ul class="item-list" id="category-items"></ul>

</div>

</div>

<div id="tab-search" class="tab-content">

<input class="search-box" placeholder="Search inventory..." oninput="searchInventory(this.value)">

<br><br>

<ul class="item-list" id="search-results"></ul>

</div>

<div class="footer-status" id="status">
Inventory connected successfully.
</div>

</div>

<div class="modal" id="category-modal">

<div class="modal-box">

<div class="modal-title">
Assign Category
</div>

<div class="modal-grid" id="modal-grid"></div>

</div>

</div>

<script>

const api = new URLSearchParams(window.location.search).get("api");

const categories = {
    "Clothing":"icon-clothing",
    "Hair":"icon-hairs",
    "Face Skin":"icon-faceskin",
    "Body Skin":"icon-bodyskin",
    "Mesh Head":"icon-meshhead",
    "Mesh Body":"icon-meshbody",
    "Accessories":"icon-accessories",
    "Skybox":"icon-skybox",
    "Houses":"icon-houses",
    "Decor":"icon-decor",
    "Objects":"icon-objects",
    "Textures":"icon-textures",
    "Scripts":"icon-scripts"
};

let inventory = [];
let selectedItem = null;

function switchTab(tabId, btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

function setStatus(text){
    document.getElementById("status").innerText = text;
}

async function loadInventory(){

    if(!api){
        setStatus("Missing SL API.");
        return;
    }

    try{

        const res = await fetch(api);
        inventory = await res.json();

        renderInventory(inventory);

    }catch(e){

        setStatus("Connection failed.");

    }

}

function getCategory(item){

    return localStorage.getItem("cat_"+item) || "Objects";

}

function setCategory(item,cat){

    localStorage.setItem("cat_"+item,cat);

}

function renderInventory(items){

    const list = document.getElementById("inventory-list");

    list.innerHTML = "";

    items.forEach(item=>{

        const category = getCategory(item);
        const icon = categories[category];

        const li = document.createElement("li");
        li.className = "item";

        li.innerHTML = `
        <input type="checkbox" class="bulk-item" value="${item}">

        <div class="item-name">${item}</div>

        <div class="item-actions">

            <div class="cat-badge"
                 title="${category}"
                 onclick="openCategoryModal('${encodeURIComponent(item)}')">

                <svg>
                    <use href="#${icon}"></use>
                </svg>

            </div>

            <button class="action-btn deliver-btn"
                    onclick="deliverItem('${encodeURIComponent(item)}', this)">
                    Deliver
            </button>

            <button class="action-btn delete-btn"
                    onclick="deleteItem('${encodeURIComponent(item)}', this)">
                    Delete
            </button>

        </div>
        `;

        list.appendChild(li);

    });

}

async function deliverItem(itemEncoded,btn){

    const item = decodeURIComponent(itemEncoded);

    btn.innerText = "Wait...";

    try{

        await fetch(api,{
            method:"POST",
            body:item
        });

        btn.innerText = "Done ✔";

        setTimeout(()=>{
            btn.innerText = "Deliver";
        },1800);

    }catch{

        btn.innerText = "Error";

    }

}

async function deleteItem(itemEncoded,btn){

    const item = decodeURIComponent(itemEncoded);

    btn.innerText = "Wait...";

    try{

        await fetch(api,{
            method:"POST",
            body:"MENU_DEL:"+item
        });

        btn.innerText = "Check SL";

    }catch{

        btn.innerText = "Error";

    }

}

async function deliverSelected(){

    const checked = [...document.querySelectorAll(".bulk-item:checked")];

    if(!checked.length) return;

    const items = checked.map(c=>c.value).join("\n");

    const btn = document.querySelector(".btn-bulk-deliver");

    btn.innerText = "Wait...";

    await fetch(api,{
        method:"POST",
        body:items
    });

    btn.innerText = "Done ✔";

    setTimeout(()=>{
        btn.innerText = "Deliver Selected";
    },1800);

}

document.getElementById("select-all").addEventListener("change",e=>{

    document.querySelectorAll(".bulk-item").forEach(cb=>{
        cb.checked = e.target.checked;
    });

});

function renderCategories(){

    const grid = document.getElementById("cat-grid");

    Object.entries(categories).forEach(([name,icon])=>{

        const div = document.createElement("div");

        div.className = "cat-circle";

        div.innerHTML = `
        <div class="cat-icon-bg">
            <svg><use href="#${icon}"></use></svg>
        </div>

        <div class="cat-label">${name}</div>
        `;

        div.onclick = ()=>openCategory(name);

        grid.appendChild(div);

    });

}

function openCategory(category){

    document.getElementById("categories-home").classList.add("hidden");

    document.getElementById("category-view").classList.remove("hidden");

    const list = document.getElementById("category-items");

    list.innerHTML = "";

    inventory
    .filter(item=>getCategory(item)===category)
    .forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `
        <div class="item-name">${item}</div>

        <div class="item-actions">

            <button class="action-btn deliver-btn"
            onclick="deliverItem('${encodeURIComponent(item)}', this)">
            Deliver
            </button>

        </div>
        `;

        list.appendChild(li);

    });

}

function closeCategoryView(){

    document.getElementById("categories-home").classList.remove("hidden");

    document.getElementById("category-view").classList.add("hidden");

}

function openCategoryModal(itemEncoded){

    selectedItem = decodeURIComponent(itemEncoded);

    const modal = document.getElementById("category-modal");

    const grid = document.getElementById("modal-grid");

    grid.innerHTML = "";

    Object.entries(categories).forEach(([name,icon])=>{

        const div = document.createElement("div");

        div.className = "modal-cat";

        div.innerHTML = `
        <svg width="22" height="22" style="margin-bottom:8px;">
        <use href="#${icon}"></use>
        </svg>
        <br>
        ${name}
        `;

        div.onclick = ()=>{

            setCategory(selectedItem,name);

            modal.classList.remove("active");

            renderInventory(inventory);

        };

        grid.appendChild(div);

    });

    modal.classList.add("active");

}

document.getElementById("category-modal").addEventListener("click",e=>{

    if(e.target.id==="category-modal"){

        e.target.classList.remove("active");

    }

});

function searchInventory(text){

    const result = inventory.filter(i=>
        i.toLowerCase().includes(text.toLowerCase())
    );

    const list = document.getElementById("search-results");

    list.innerHTML = "";

    result.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `
        <div class="item-name">${item}</div>

        <div class="item-actions">

            <button class="action-btn deliver-btn"
            onclick="deliverItem('${encodeURIComponent(item)}', this)">
            Deliver
            </button>

        </div>
        `;

        list.appendChild(li);

    });

}

renderCategories();
loadInventory();

</script>

</body>
</html>

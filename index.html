<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --danger:#ff4b4b;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:16px;
    padding:10px 14px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:1px;
    color:#d8d8d8;
    text-transform:uppercase;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk-deliver{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:.2s;
}

.btn-bulk-deliver:hover{
    transform:translateY(-1px);
}

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:var(--transition);
}

.cat-circle:hover{
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;
    border-radius:26px;
    background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:var(--transition);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 18px 35px rgba(0,0,0,.45);
}

.cat-circle:hover .cat-icon-bg{
    border-color:#4e4e4e;
}

.cat-icon-bg svg{
    width:42px;
    height:42px;
    fill:#f3f3f3;
}

.cat-label{
    font-size:.65rem;
    letter-spacing:1.4px;
    font-weight:700;
    text-transform:uppercase;
    color:#9c9c9c;
    text-align:center;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
    transition:.2s;
}

.item:hover{
    background:#111;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.cat-badge{
    width:38px;
    height:38px;
    border-radius:14px;
    border:1px solid #292929;
    background:#070707;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
}

.cat-badge:hover{
    border-color:#555;
    transform:translateY(-1px);
}

.cat-badge svg{
    width:16px;
    height:16px;
    fill:#fff;
}

.cat-tooltip{
    position:absolute;
    bottom:-34px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:#000;
    font-size:.55rem;
    font-weight:800;
    padding:6px 8px;
    border-radius:8px;
    letter-spacing:1px;
    opacity:0;
    pointer-events:none;
    transition:.18s;
    white-space:nowrap;
    text-transform:uppercase;
    z-index:20;
}

.cat-badge:hover .cat-tooltip{
    opacity:1;
    bottom:-30px;
}

.action-btn{
    border:none;
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:.2s;
}

.receive-btn{
    background:#fff;
    color:#000;
}

.delete-btn{
    background:#171717;
    color:#ff5d5d;
    border:1px solid #262626;
}

.action-btn:hover{
    transform:translateY(-1px);
}

.search-box{
    width:100%;
    background:#0d0d0d;
    border:1px solid #232323;
    color:#fff;
    padding:16px 18px;
    border-radius:18px;
    outline:none;
    font-size:.9rem;
    margin-bottom:20px;
}

.search-box:focus{
    border-color:#4d4d4d;
}

.empty-watermark{
    padding:80px 20px;
    text-align:center;
}

.empty-watermark-title{
    font-size:1rem;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:10px;
}

.empty-watermark-sub{
    color:#666;
}

.footer-status{
    margin-top:24px;
    text-align:center;
    font-size:.75rem;
    color:#666;
}

.loading{
    padding:40px;
    text-align:center;
    color:#666;
}

</style>
</head>
<body>

<svg style="display:none;">

<symbol id="icon-clothing" viewBox="0 0 24 24">
<path d="M12 3l4 3 3-1 2 4-3 2v8H6v-8L3 9l2-4 3 1z"/>
</symbol>

<symbol id="icon-hairs" viewBox="0 0 24 24">
<path d="M12 2C7.5 2 4 5.5 4 10v2c0 5.2 3.2 10 8 10s8-4.8 8-10v-2c0-4.5-3.5-8-8-8zm-5 9c1.4-.5 3.2-1.8 4.5-3.8 1.4 2.6 4.2 4.2 7 4.7V13c0 4-2.4 7-6.5 7S5.5 17 5.5 13V11zm12-1.5c-3.4-.7-6-3-6.9-5.8-1.2 2.2-3.6 4.5-6.1 5.4C6.4 5.8 8.8 4 12 4c4 0 7 2.5 7 5.5z"/>
<path d="M7 8c2-2.6 4.8-4 8.4-4-1.6 1.1-2.7 2.5-3.4 4.2 2 .2 3.7 1 5 2.3-2.2-.5-4.6-.2-6.8.7C9 10 8 9 7 8z"/>
</symbol>

<symbol id="icon-faceskin" viewBox="0 0 24 24">
<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-4 7a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm8 0a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm-4 8c-2 0-3.7-1-4.5-2.5h9C15.7 16 14 17 12 17z"/>
</symbol>

<symbol id="icon-bodyskin" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 013 3v2h2c1.7 0 3 1.3 3 3v9h-3v-5h-2v5H9v-5H7v5H4v-9c0-1.7 1.3-3 3-3h2V5a3 3 0 013-3z"/>
</symbol>

<symbol id="icon-meshhead" viewBox="0 0 24 24">
<path d="M12 2C7 2 4 6 4 11v2c0 5 3 9 8 9s8-4 8-9v-2c0-5-3-9-8-9zm0 2c3.7 0 6 2.7 6 6v2c0 3.9-2.2 7-6 7s-6-3.1-6-7v-2c0-3.3 2.3-6 6-6z"/>
<circle cx="9" cy="11" r="1"/>
<circle cx="15" cy="11" r="1"/>
<path d="M9.5 15c1.2 1 3.8 1 5 0" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
</symbol>

<symbol id="icon-meshbody" viewBox="0 0 24 24">
<path d="M12 2a4 4 0 100 8 4 4 0 000-8zm0 10c-4 0-7 2-7 5v3h14v-3c0-3-3-5-7-5z"/>
</symbol>

<symbol id="icon-accessories" viewBox="0 0 24 24">
<path d="M12 2l9 7-9 13L3 9l9-7z"/>
</symbol>

<symbol id="icon-skybox" viewBox="0 0 24 24">
<path d="M12 3l5 4v3h2v2h-2v3H7v-3H5v-2h2V7l5-4z"/>
<path d="M4 17c2.5-2 5.5-2 8 0 2.5-2 5.5-2 8 0-1 2.5-3.5 4-8 4s-7-1.5-8-4z"/>
</symbol>

<symbol id="icon-houses" viewBox="0 0 24 24">
<path d="M12 3L3 11h3v9h12v-9h3z"/>
</symbol>

<symbol id="icon-decor" viewBox="0 0 24 24">
<path d="M4 10h16v8H4zM7 6h10v2H7z"/>
</symbol>

<symbol id="icon-objects" viewBox="0 0 24 24">
<path d="M12 2l8 4v12l-8 4-8-4V6z"/>
</symbol>

<symbol id="icon-textures" viewBox="0 0 24 24">
<path d="M3 3h18v18H3zM7 7h4v4H7zm6 0h4v4h-4zm-6 6h4v4H7zm6 0h4v4h-4z"/>
</symbol>

<symbol id="icon-scripts" viewBox="0 0 24 24">
<path d="M8 6L2 12l6 6 2-2-4-4 4-4zm8 0l-2 2 4 4-4 4 2 2 6-6z"/>
</symbol>

</svg>

<div class="container">

<header>
<h1>✦ PERSONAL INVENTORY</h1>
<div class="subtitle">powered by Saori Suki</div>
</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory', this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories', this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('search', this)">
Search
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" class="item-cb" id="select-all">
Select All
</label>

<button class="btn-bulk-deliver" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list">
<div class="loading">Loading inventory...</div>
</ul>

</div>

<div id="tab-categories" class="tab-content">

<div class="cat-grid">

<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-clothing"></use></svg></div><div class="cat-label">Clothing</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-hairs"></use></svg></div><div class="cat-label">Hair</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-faceskin"></use></svg></div><div class="cat-label">Face Skin</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-bodyskin"></use></svg></div><div class="cat-label">Body Skin</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-meshhead"></use></svg></div><div class="cat-label">Mesh Head</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-meshbody"></use></svg></div><div class="cat-label">Mesh Body</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-accessories"></use></svg></div><div class="cat-label">Accessories</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-skybox"></use></svg></div><div class="cat-label">Skybox</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-houses"></use></svg></div><div class="cat-label">Houses</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-decor"></use></svg></div><div class="cat-label">Decor</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-objects"></use></svg></div><div class="cat-label">Objects</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-textures"></use></svg></div><div class="cat-label">Textures</div></div>
<div class="cat-circle"><div class="cat-icon-bg"><svg><use href="#icon-scripts"></use></svg></div><div class="cat-label">Scripts</div></div>

</div>

</div>

<div id="tab-search" class="tab-content">

<input type="text" class="search-box" id="search-input" placeholder="Search inventory folders...">

<ul class="item-list" id="search-results"></ul>

</div>

<div class="footer-status" id="status">
Inventory connected successfully.
</div>

</div>

<script>

const API_URL = new URLSearchParams(window.location.search).get("api");

let inventoryData = [];
let selectedItems = [];

function switchTab(tabId, btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

function getCategoryData(name){

    const lower = name.toLowerCase();

    if(lower.includes('hair')) return ['icon-hairs','Hair'];
    if(lower.includes('skin')) return ['icon-faceskin','Skin'];
    if(lower.includes('body')) return ['icon-meshbody','Body'];
    if(lower.includes('head')) return ['icon-meshhead','Mesh Head'];
    if(lower.includes('house')) return ['icon-houses','Houses'];
    if(lower.includes('skybox')) return ['icon-skybox','Skybox'];
    if(lower.includes('decor')) return ['icon-decor','Decor'];
    if(lower.includes('script')) return ['icon-scripts','Scripts'];
    if(lower.includes('texture')) return ['icon-textures','Textures'];
    if(lower.includes('shoe')) return ['icon-accessories','Accessories'];

    return ['icon-clothing','Clothing'];
}

function renderInventory(items, targetId){

    const target = document.getElementById(targetId);

    if(items.length === 0){
        target.innerHTML = `
        <div class="empty-watermark">
            <div class="empty-watermark-title">
                Nothing Found
            </div>
            <div class="empty-watermark-sub">
                No matching folders.
            </div>
        </div>
        `;
        return;
    }

    target.innerHTML = '';

    items.forEach(item=>{

        const [icon,category] = getCategoryData(item);

        const li = document.createElement('li');
        li.className = 'item';

        li.innerHTML = `
        <input type="checkbox" class="item-cb item-select" value="${item}">

        <div class="item-name">${item}</div>

        <div class="item-actions">

            <div class="cat-badge">
                <svg><use href="#${icon}"></use></svg>
                <div class="cat-tooltip">${category}</div>
            </div>

            <button class="action-btn receive-btn">
                Deliver
            </button>

            <button class="action-btn delete-btn">
                Delete
            </button>

        </div>
        `;

        li.querySelector('.receive-btn').onclick = ()=>{
            deliverItem(item);
        };

        li.querySelector('.delete-btn').onclick = ()=>{
            deleteItem(item);
        };

        li.querySelector('.item-select').addEventListener('change',(e)=>{

            if(e.target.checked){

                if(!selectedItems.includes(item)){
                    selectedItems.push(item);
                }

            }else{

                selectedItems = selectedItems.filter(i=>i!==item);

            }

        });

        target.appendChild(li);

    });

}

async function loadInventory(){

    if(!API_URL){

        document.getElementById('status').innerText =
        'Missing API URL';

        return;
    }

    try{

        const response = await fetch(API_URL);
        const data = await response.json();

        inventoryData = data.map(i=>decodeURIComponent(i));

        renderInventory(inventoryData,'inventory-list');

    }catch(e){

        document.getElementById('status').innerText =
        'Connection failed';

    }

}

async function deliverItem(item){

    await fetch(API_URL,{
        method:'POST',
        body:item
    });

}

async function deleteItem(item){

    await fetch(API_URL,{
        method:'POST',
        body:'MENU_DEL:' + item
    });

}

async function deliverSelected(){

    if(selectedItems.length === 0){
        return;
    }

    await fetch(API_URL,{
        method:'POST',
        body:selectedItems.join('\n')
    });

}

document.getElementById('select-all').addEventListener('change',(e)=>{

    selectedItems = [];

    document.querySelectorAll('.item-select').forEach(cb=>{

        cb.checked = e.target.checked;

        if(e.target.checked){
            selectedItems.push(cb.value);
        }

    });

});

document.getElementById('search-input').addEventListener('input',(e)=>{

    const value = e.target.value.toLowerCase();

    const filtered = inventoryData.filter(item=>
        item.toLowerCase().includes(value)
    );

    renderInventory(filtered,'search-results');

});

loadInventory();

</script>

</body>
</html>

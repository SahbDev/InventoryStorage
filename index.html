<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MMC Inventory Storage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0d;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

header{
    padding:30px 20px 10px;
    text-align:center;
}

header h1{
    font-size:38px;
    letter-spacing:2px;
    margin-bottom:10px;
}

header p{
    opacity:.7;
    font-size:14px;
}

.topbar{
    width:100%;
    max-width:1200px;
    margin:25px auto 0;
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    padding:0 20px;
}

.search{
    flex:1;
    min-width:250px;
    max-width:520px;
}

.search input{
    width:100%;
    height:48px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#151519;
    color:#fff;
    padding:0 18px;
    font-size:15px;
}

.select-all{
    height:44px;
    padding:0 18px;
    border:none;
    border-radius:12px;
    background:#19191f;
    color:#fff;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
    transition:.2s;
    white-space:nowrap;
}

.select-all:hover{
    background:#23232c;
}

.delivery{
    height:44px;
    padding:0 20px;
    border:none;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
    font-size:13px;
    white-space:nowrap;
}

.delivery:hover{
    transform:translateY(-1px);
}

.categories{
    width:100%;
    max-width:1200px;
    margin:35px auto 20px;
    padding:0 20px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
}

.category{
    width:95px;
    height:95px;
    background:#141418;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    cursor:pointer;
    transition:.25s;
    position:relative;
    border:1px solid #1e1e24;
}

.category:hover{
    transform:translateY(-4px);
    background:#1a1a20;
}

.category.active{
    background:#fff;
    color:#000;
}

.category .icon{
    font-size:30px;
}

.category .label{
    font-size:12px;
    font-weight:600;
    text-align:center;
    line-height:1.1;
}

.inventory{
    width:100%;
    max-width:1200px;
    margin:30px auto 80px;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.card{
    background:#131317;
    border-radius:22px;
    padding:18px;
    border:1px solid #1e1e25;
    transition:.25s;
    position:relative;
}

.card:hover{
    transform:translateY(-4px);
    background:#18181d;
}

.card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.item-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#202028;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    position:relative;
}

.item-icon::after{
    content:attr(data-category);
    position:absolute;
    bottom:-34px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:#000;
    padding:6px 10px;
    border-radius:10px;
    font-size:11px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    white-space:nowrap;
    z-index:10;
}

.item-icon:hover::after{
    opacity:1;
}

.checkbox{
    width:22px;
    height:22px;
    border-radius:7px;
    border:2px solid #4b4b57;
    cursor:pointer;
    transition:.2s;
}

.checkbox.active{
    background:#fff;
    border-color:#fff;
}

.item-name{
    font-size:14px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:18px;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:10px;
}

.actions button{
    flex:1;
    height:40px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
    font-size:13px;
}

.receive{
    background:#fff;
    color:#000;
}

.delete{
    background:#1d1d23;
    color:#ff6b6b;
}

.actions button:hover{
    transform:translateY(-1px);
}

.empty{
    text-align:center;
    opacity:.6;
    padding:80px 20px;
    font-size:14px;
}

.loading{
    text-align:center;
    padding:80px 20px;
    opacity:.7;
}

@media(max-width:700px){

    .category{
        width:82px;
        height:82px;
    }

    .inventory{
        grid-template-columns:1fr;
    }

}
</style>
</head>
<body>

<header>
    <h1>MMC STORAGE</h1>
    <p>Personal Inventory Web Manager</p>
</header>

<div class="topbar">

    <div class="search">
        <input type="text" id="searchInput" placeholder="Search inventory...">
    </div>

    <button class="select-all" id="selectAllBtn">
        SELECT ALL
    </button>

    <button class="delivery" id="deliverBtn">
        DELIVERY SELECTED
    </button>

</div>

<div class="categories">

    <div class="category active" data-category="all">
        <div class="icon">✨</div>
        <div class="label">ALL</div>
    </div>

    <div class="category" data-category="hair">
        <div class="icon">💇‍♀️</div>
        <div class="label">HAIR</div>
    </div>

    <div class="category" data-category="meshhead">
        <div class="icon">👩</div>
        <div class="label">MESH HEAD</div>
    </div>

    <div class="category" data-category="skybox">
        <div class="icon">🏝️</div>
        <div class="label">SKYBOX</div>
    </div>

    <div class="category" data-category="houses">
        <div class="icon">🏠</div>
        <div class="label">HOUSES</div>
    </div>

    <div class="category" data-category="body">
        <div class="icon">🧍</div>
        <div class="label">BODY</div>
    </div>

    <div class="category" data-category="clothes">
        <div class="icon">👗</div>
        <div class="label">CLOTHES</div>
    </div>

    <div class="category" data-category="shoes">
        <div class="icon">👠</div>
        <div class="label">SHOES</div>
    </div>

</div>

<div class="inventory" id="inventory">
    <div class="loading">Loading inventory...</div>
</div>

<script>
const inventoryEl = document.getElementById("inventory");
const searchInput = document.getElementById("searchInput");
const deliverBtn = document.getElementById("deliverBtn");
const selectAllBtn = document.getElementById("selectAllBtn");

const params = new URLSearchParams(window.location.search);
const apiUrl = params.get("api");

let inventory = [];
let selectedItems = [];
let currentCategory = "all";

function getCategory(name){

    const n = name.toLowerCase();

    if(n.includes("hair")) return "hair";
    if(n.includes("mesh") || n.includes("head")) return "meshhead";
    if(n.includes("skybox")) return "skybox";
    if(n.includes("house")) return "houses";
    if(n.includes("body")) return "body";
    if(n.includes("shoe") || n.includes("heel")) return "shoes";
    if(n.includes("dress") || n.includes("outfit") || n.includes("top")) return "clothes";

    return "all";
}

function getIcon(category){

    switch(category){

        case "hair":
            return "💇‍♀️";

        case "meshhead":
            return "👩";

        case "skybox":
            return "🏝️";

        case "houses":
            return "🏠";

        case "body":
            return "🧍";

        case "clothes":
            return "👗";

        case "shoes":
            return "👠";

        default:
            return "✨";
    }
}

async function loadInventory(){

    if(!apiUrl){
        inventoryEl.innerHTML = `
            <div class="empty">
                Missing API URL.
            </div>
        `;
        return;
    }

    try{

        const response = await fetch(apiUrl);
        const data = await response.json();

        inventory = data.map(item => decodeURIComponent(item));

        renderInventory();

    }catch(err){

        inventoryEl.innerHTML = `
            <div class="empty">
                Failed to connect to Second Life server.
            </div>
        `;
    }
}

function renderInventory(){

    const search = searchInput.value.toLowerCase();

    let filtered = inventory.filter(item => {

        const matchesSearch = item.toLowerCase().includes(search);

        const itemCategory = getCategory(item);

        const matchesCategory =
            currentCategory === "all" ||
            itemCategory === currentCategory;

        return matchesSearch && matchesCategory;
    });

    if(filtered.length === 0){

        inventoryEl.innerHTML = `
            <div class="empty">
                No inventory found.
            </div>
        `;

        return;
    }

    inventoryEl.innerHTML = "";

    filtered.forEach(item => {

        const category = getCategory(item);

        const card = document.createElement("div");
        card.className = "card";

        const isSelected = selectedItems.includes(item);

        card.innerHTML = `
            <div class="card-top">

                <div 
                    class="item-icon"
                    data-category="${category.toUpperCase()}"
                >
                    ${getIcon(category)}
                </div>

                <div 
                    class="checkbox ${isSelected ? "active" : ""}"
                    onclick='toggleSelect(${JSON.stringify(item)})'
                ></div>

            </div>

            <div class="item-name">
                ${item}
            </div>

            <div class="actions">

                <button 
                    class="receive"
                    onclick='deliverItem(${JSON.stringify(item)})'
                >
                    RECEIVE
                </button>

                <button 
                    class="delete"
                    onclick='deleteItem(${JSON.stringify(item)})'
                >
                    DELETE
                </button>

            </div>
        `;

        inventoryEl.appendChild(card);

    });

}

function toggleSelect(item){

    if(selectedItems.includes(item)){

        selectedItems = selectedItems.filter(i => i !== item);

    }else{

        selectedItems.push(item);

    }

    renderInventory();
}

async function deliverItem(item){

    if(!apiUrl) return;

    await fetch(apiUrl,{
        method:"POST",
        body:item
    });

    alert("Delivered: " + item);
}

async function deleteItem(item){

    if(!apiUrl) return;

    await fetch(apiUrl,{
        method:"POST",
        body:"MENU_DEL:" + item
    });

    alert("Delete confirmation opened in Second Life.");
}

deliverBtn.addEventListener("click", async () => {

    if(selectedItems.length === 0){
        alert("No items selected.");
        return;
    }

    await fetch(apiUrl,{
        method:"POST",
        body:selectedItems.join("\n")
    });

    alert(selectedItems.length + " items delivered.");
});

selectAllBtn.addEventListener("click", () => {

    const visibleItems = inventory.filter(item => {

        const matchesSearch =
            item.toLowerCase().includes(
                searchInput.value.toLowerCase()
            );

        const itemCategory = getCategory(item);

        const matchesCategory =
            currentCategory === "all" ||
            itemCategory === currentCategory;

        return matchesSearch && matchesCategory;
    });

    const allSelected = visibleItems.every(item =>
        selectedItems.includes(item)
    );

    if(allSelected){

        selectedItems = selectedItems.filter(
            item => !visibleItems.includes(item)
        );

    }else{

        visibleItems.forEach(item => {

            if(!selectedItems.includes(item)){
                selectedItems.push(item);
            }

        });
    }

    renderInventory();
});

searchInput.addEventListener("input", renderInventory);

document.querySelectorAll(".category").forEach(cat => {

    cat.addEventListener("click", () => {

        document
            .querySelectorAll(".category")
            .forEach(c => c.classList.remove("active"));

        cat.classList.add("active");

        currentCategory = cat.dataset.category;

        renderInventory();
    });
});

loadInventory();
</script>

</body>
</html>

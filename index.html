<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --danger:#ff4b4b;
    --green:#67ff9c;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px 18px;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
        #060606;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;
    background:linear-gradient(180deg,#111111,#0a0a0a);
    border:1px solid var(--line);
    border-radius:34px;
    padding:34px;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

header{
    text-align:center;
    padding-bottom:24px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:26px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    padding:12px 16px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
    flex-wrap:wrap;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.5px;
    color:#d8d8d8;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk-deliver{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.btn-bulk-deliver:hover{
    transform:translateY(-1px);
}

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
    gap:24px;
}

.cat-circle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:var(--transition);
}

.cat-circle:hover{
    transform:translateY(-4px);
}

.cat-icon-bg{
    width:88px;
    height:88px;
    border-radius:26px;
    background:linear-gradient(180deg,#181818,#0d0d0d);
    border:1px solid #262626;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:var(--transition);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 18px 35px rgba(0,0,0,.45);
}

.cat-circle:hover .cat-icon-bg{
    border-color:#4e4e4e;
}

.cat-icon-bg svg{
    width:42px;
    height:42px;
    fill:#f3f3f3;
}

.cat-label{
    font-size:.65rem;
    letter-spacing:1.4px;
    font-weight:700;
    text-transform:uppercase;
    color:#9c9c9c;
    text-align:center;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.action-btn{
    background:#111;
    border:1px solid #2a2a2a;
    color:#fff;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:700;
    transition:var(--transition);
}

.action-btn:hover{
    border-color:#555;
}

.action-btn.delete{
    border-color:#3a1515;
    color:#ff9090;
}

.action-btn.delete:hover{
    background:#220d0d;
}

.empty-watermark{
    padding:80px 20px;
    text-align:center;
}

.empty-watermark-title{
    font-size:1rem;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:10px;
}

.empty-watermark-sub{
    color:#666;
}

.footer-status{
    margin-top:24px;
    text-align:center;
    font-size:.75rem;
    color:#666;
}

.search-box{
    width:100%;
    padding:16px 18px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    color:#fff;
    outline:none;
    margin-bottom:18px;
    font-size:.9rem;
}

.search-box:focus{
    border-color:#4e4e4e;
}

.status-online{
    color:var(--green);
}

.status-error{
    color:#ff7676;
}

.back-btn{
    margin-bottom:18px;
    background:#111;
    border:1px solid #262626;
    color:#fff;
    padding:12px 16px;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
}

</style>
</head>
<body>

<div class="container">

<header>
<h1>✦ PERSONAL INVENTORY</h1>
<div class="subtitle">powered by Saori Suki</div>
</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory',this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories',this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('search',this)">
Search
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="bulk-actions">

<label class="checkbox-label">
<input type="checkbox" id="selectAll" class="item-cb">
Select All
</label>

<button class="btn-bulk-deliver" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-categories" class="tab-content">

<div id="categories-view">

<div class="cat-grid">

<div class="cat-circle" onclick="openCategory('hair')">
<div class="cat-icon-bg">💇</div>
<div class="cat-label">Hair</div>
</div>

<div class="cat-circle" onclick="openCategory('skin')">
<div class="cat-icon-bg">✨</div>
<div class="cat-label">Skin</div>
</div>

<div class="cat-circle" onclick="openCategory('mesh')">
<div class="cat-icon-bg">🧍</div>
<div class="cat-label">Mesh</div>
</div>

<div class="cat-circle" onclick="openCategory('clothing')">
<div class="cat-icon-bg">👕</div>
<div class="cat-label">Clothing</div>
</div>

<div class="cat-circle" onclick="openCategory('accessories')">
<div class="cat-icon-bg">💎</div>
<div class="cat-label">Accessories</div>
</div>

<div class="cat-circle" onclick="openCategory('decor')">
<div class="cat-icon-bg">🪑</div>
<div class="cat-label">Decor</div>
</div>

<div class="cat-circle" onclick="openCategory('houses')">
<div class="cat-icon-bg">🏠</div>
<div class="cat-label">Houses</div>
</div>

<div class="cat-circle" onclick="openCategory('textures')">
<div class="cat-icon-bg">🧩</div>
<div class="cat-label">Textures</div>
</div>

</div>

</div>

<div id="category-items-view" style="display:none;">

<button class="back-btn" onclick="closeCategory()">
← Back
</button>

<ul class="item-list" id="category-list"></ul>

</div>

</div>

<div id="tab-search" class="tab-content">

<input
type="text"
class="search-box"
placeholder="Search inventory..."
oninput="searchInventory(this.value)"
>

<ul class="item-list" id="search-results"></ul>

</div>

<div class="footer-status" id="statusText">
Connecting...
</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const api = params.get("api");

let inventory = [];

if(!api){
    document.getElementById("statusText").innerHTML =
    '<span class="status-error">Missing SL API.</span>';
}
else{
    loadInventory();
}

async function loadInventory(){

    try{

        const response = await fetch(api);

        const data = await response.json();

        inventory = data.map(v=>decodeURIComponent(v));

        renderInventory(inventory);

        document.getElementById("statusText").innerHTML =
        '<span class="status-online">Inventory connected successfully.</span>';

    }catch(err){

        console.error(err);

        document.getElementById("statusText").innerHTML =
        '<span class="status-error">Connection failed.</span>';
    }
}

function renderInventory(items){

    const list = document.getElementById("inventory-list");

    list.innerHTML = "";

    if(!items.length){

        list.innerHTML = `
        <div class="empty-watermark">
            <div class="empty-watermark-title">
            Empty
            </div>
            <div class="empty-watermark-sub">
            No folders detected.
            </div>
        </div>
        `;

        return;
    }

    items.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `
        <input type="checkbox" class="item-cb itemCheck" value="${escapeHtml(item)}">

        <div class="item-name">${escapeHtml(item)}</div>

        <div class="item-actions">

            <button class="action-btn" onclick="deliverItem(this,'${escapeJs(item)}')">
            Deliver
            </button>

            <button class="action-btn delete" onclick="deleteItem(this,'${escapeJs(item)}')">
            Delete
            </button>

        </div>
        `;

        list.appendChild(li);

    });
}

async function deliverItem(btn,item){

    const original = btn.innerText;

    btn.innerText = "Wait...";

    try{

        await fetch(api,{
            method:"POST",
            body:item
        });

        btn.innerText = "Done ✔";

    }catch{

        btn.innerText = "Error";

    }

    setTimeout(()=>{
        btn.innerText = original;
    },2000);
}

async function deleteItem(btn,item){

    const original = btn.innerText;

    btn.innerText = "Wait...";

    try{

        await fetch(api,{
            method:"POST",
            body:"MENU_DEL:" + item
        });

        btn.innerText = "Check SL";

    }catch{

        btn.innerText = "Error";

    }

    setTimeout(()=>{
        btn.innerText = original;
    },2500);
}

async function deliverSelected(){

    const checked = [...document.querySelectorAll(".itemCheck:checked")];

    if(!checked.length) return;

    const payload = checked.map(cb=>cb.value).join("\n");

    const btn = document.querySelector(".btn-bulk-deliver");

    const old = btn.innerText;

    btn.innerText = "Sending...";

    try{

        await fetch(api,{
            method:"POST",
            body:payload
        });

        btn.innerText = "Delivered ✔";

    }catch{

        btn.innerText = "Error";

    }

    setTimeout(()=>{
        btn.innerText = old;
    },2200);
}

document.getElementById("selectAll").addEventListener("change",e=>{

    document.querySelectorAll(".itemCheck").forEach(cb=>{
        cb.checked = e.target.checked;
    });

});

function searchInventory(query){

    query = query.toLowerCase();

    const results = inventory.filter(v=>
        v.toLowerCase().includes(query)
    );

    renderSearch(results);
}

function renderSearch(results){

    const list = document.getElementById("search-results");

    list.innerHTML = "";

    results.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `
        <div class="item-name">${escapeHtml(item)}</div>

        <div class="item-actions">

            <button class="action-btn" onclick="deliverItem(this,'${escapeJs(item)}')">
            Deliver
            </button>

        </div>
        `;

        list.appendChild(li);

    });
}

function openCategory(cat){

    document.getElementById("categories-view").style.display = "none";

    document.getElementById("category-items-view").style.display = "block";

    const list = document.getElementById("category-list");

    list.innerHTML = "";

    const filtered = inventory.filter(v=>{

        const lower = v.toLowerCase();

        if(cat==="hair") return lower.includes("hair");
        if(cat==="skin") return lower.includes("skin");
        if(cat==="mesh") return lower.includes("mesh");
        if(cat==="clothing") return lower.includes("shirt") || lower.includes("pant") || lower.includes("outfit");
        if(cat==="accessories") return lower.includes("access");
        if(cat==="decor") return lower.includes("decor");
        if(cat==="houses") return lower.includes("house");
        if(cat==="textures") return lower.includes("texture");

        return false;
    });

    filtered.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `
        <div class="item-name">${escapeHtml(item)}</div>

        <div class="item-actions">

            <button class="action-btn" onclick="deliverItem(this,'${escapeJs(item)}')">
            Deliver
            </button>

        </div>
        `;

        list.appendChild(li);

    });
}

function closeCategory(){

    document.getElementById("categories-view").style.display = "block";

    document.getElementById("category-items-view").style.display = "none";
}

function switchTab(tabId,btnElement){

    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content').forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`).classList.add('active');

    btnElement.classList.add('active');
}

function escapeHtml(str){

    return str
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function escapeJs(str){

    return str
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

</script>

</body>
</html>

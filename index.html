<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MMC Personal Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#141414;
    --line:#202020;
    --line2:#2a2a2a;
    --text:#f3f3f3;
    --soft:#a1a1a1;
    --dim:#666;
    --green:#7dffb2;
    --danger:#ff5b5b;
    --transition:all .22s ease;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:40px 18px;
    background:
    radial-gradient(circle at top, rgba(255,255,255,.03), transparent 30%),
    #060606;

    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
}

.container{
    width:100%;
    max-width:760px;

    background:linear-gradient(180deg,#111111,#0a0a0a);

    border:1px solid var(--line);

    border-radius:34px;

    padding:34px;

    box-shadow:
    0 30px 80px rgba(0,0,0,.65);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
}

.status-pill{
    display:flex;
    align-items:center;
    gap:10px;

    background:#0f0f0f;
    border:1px solid #232323;

    padding:12px 16px;

    border-radius:999px;

    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);

    box-shadow:
    0 0 10px rgba(125,255,178,.7);
}

.top-actions{
    display:flex;
    gap:10px;
}

.mini-btn{
    background:#101010;
    border:1px solid #262626;
    color:#fff;

    width:46px;
    height:46px;

    border-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:var(--transition);
}

.mini-btn:hover{
    transform:translateY(-2px);
    border-color:#4a4a4a;
}

.mini-btn svg{
    width:17px;
    height:17px;
    fill:#fff;
}

header{
    text-align:center;
    padding-bottom:26px;
    border-bottom:1px solid #1b1b1b;
}

h1{
    margin:0;
    font-size:1.05rem;
    letter-spacing:4px;
    font-weight:800;
    text-transform:uppercase;
}

.subtitle{
    margin-top:12px;
    color:var(--dim);
    font-size:.78rem;
    letter-spacing:1px;
}

.stats{
    margin-top:22px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.stat-card{
    background:#0d0d0d;
    border:1px solid #202020;
    border-radius:22px;

    padding:18px;
    text-align:center;
}

.stat-value{
    font-size:1.15rem;
    font-weight:800;
}

.stat-label{
    margin-top:8px;
    color:#777;
    font-size:.65rem;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:28px 0;
}

.tab-btn{
    background:linear-gradient(180deg,#181818,#111111);
    border:1px solid #262626;
    color:#8d8d8d;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:var(--transition);
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.tab-btn:hover{
    transform:translateY(-2px);
    color:#fff;
    border-color:#4a4a4a;
}

.tab-btn.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.bulk-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    background:#0c0c0c;
    border:1px solid #232323;
    border-radius:18px;
    padding:12px 16px;
    margin-bottom:18px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
    flex-wrap:wrap;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.5px;
    color:#d8d8d8;
}

.item-cb{
    accent-color:#fff;
}

.btn-bulk{
    background:#fff;
    color:#000;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.btn-bulk:hover{
    transform:translateY(-1px);
}

.search-box{
    width:100%;
    padding:18px 18px;

    background:#0d0d0d;
    border:1px solid #222;

    border-radius:20px;

    color:#fff;
    outline:none;

    margin-bottom:20px;

    font-size:.9rem;
}

.search-box:focus{
    border-color:#4e4e4e;
}

.item-list{
    list-style:none;
    margin:0;
    padding:0;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #202020;
    background:#0c0c0c;
}

.item{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:16px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:.88rem;
    font-weight:500;
    word-break:break-word;
}

.item-tags{
    margin-top:8px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.tag{
    background:#111;
    border:1px solid #2a2a2a;
    color:#aaa;

    padding:5px 8px;

    border-radius:999px;

    font-size:.56rem;
    letter-spacing:.5px;
    text-transform:uppercase;
}

.item-actions{
    display:flex;
    gap:10px;
}

.action-btn{
    background:#111;
    border:1px solid #2a2a2a;
    color:#fff;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:.62rem;
    font-weight:700;
    transition:var(--transition);
}

.action-btn:hover{
    border-color:#555;
}

.action-btn.delete{
    color:#ff8d8d;
    border-color:#3a1d1d;
}

.action-btn.delete:hover{
    background:#1a0d0d;
}

.cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:20px;
}

.cat-card{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:28px;
    padding:26px 18px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;

    cursor:pointer;
    transition:var(--transition);
}

.cat-card:hover{
    transform:translateY(-4px);
    border-color:#444;
}

.cat-icon{
    width:58px;
    height:58px;

    border-radius:18px;

    background:#111;
    border:1px solid #262626;

    display:flex;
    justify-content:center;
    align-items:center;
}

.cat-icon svg{
    width:24px;
    height:24px;
    fill:#fff;
}

.cat-name{
    font-size:.66rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#a0a0a0;
    font-weight:700;
}

.empty{
    padding:70px 20px;
    text-align:center;
    color:#666;
}

.back-btn{
    margin-bottom:18px;

    background:#101010;
    border:1px solid #262626;

    color:#fff;

    padding:12px 18px;

    border-radius:14px;

    cursor:pointer;
}

@media(max-width:680px){

    .stats{
        grid-template-columns:1fr;
    }

    .item{
        grid-template-columns:1fr;
    }

    .item-actions{
        width:100%;
    }

    .action-btn{
        flex:1;
    }
}

</style>
</head>
<body>

<div class="container">

<div class="topbar">

<div class="status-pill">
<div class="status-dot"></div>
CONNECTED
</div>

<div class="top-actions">

<div class="mini-btn" onclick="refreshInventory()" title="Refresh">

<svg viewBox="0 0 24 24">
<path d="M17.65 6.35A7.95 7.95 0 0012 4V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107.75-6.95z"/>
</svg>

</div>

<div class="mini-btn" onclick="resetScript()" title="Reset Script">

<svg viewBox="0 0 24 24">
<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6a6 6 0 11-6-6z"/>
</svg>

</div>

</div>

</div>

<header>

<h1>✦ PERSONAL INVENTORY</h1>

<div class="subtitle">
powered by Saori Suki
</div>

<div class="stats">

<div class="stat-card">
<div class="stat-value" id="totalItems">0</div>
<div class="stat-label">Folders</div>
</div>

<div class="stat-card">
<div class="stat-value" id="selectedCount">0</div>
<div class="stat-label">Selected</div>
</div>

<div class="stat-card">
<div class="stat-value" id="fatpackCount">0</div>
<div class="stat-label">Fatpacks</div>
</div>

</div>

</header>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('inventory',this)">
Inventory
</button>

<button class="tab-btn" onclick="switchTab('categories',this)">
Categories
</button>

<button class="tab-btn" onclick="switchTab('search',this)">
Search
</button>

</div>

<div id="tab-inventory" class="tab-content active">

<div class="bulk-actions">

<label class="checkbox-label">

<input type="checkbox" id="selectAll" class="item-cb">

Select All

</label>

<button class="btn-bulk" onclick="deliverSelected()">
Deliver Selected
</button>

</div>

<ul class="item-list" id="inventory-list"></ul>

</div>

<div id="tab-categories" class="tab-content">

<div id="categoryGrid" class="cat-grid">

<div class="cat-card" onclick="filterCategory('hair')">

<div class="cat-icon">

<svg viewBox="0 0 24 24">
<path d="M12 2C7 2 4 6 4 11v2c0 5 3 9 8 9s8-4 8-9v-2c0-5-3-9-8-9z"/>
</svg>

</div>

<div class="cat-name">Hair</div>

</div>

<div class="cat-card" onclick="filterCategory('skin')">

<div class="cat-icon">

<svg viewBox="0 0 24 24">
<path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/>
</svg>

</div>

<div class="cat-name">Skin</div>

</div>

<div class="cat-card" onclick="filterCategory('mesh')">

<div class="cat-icon">

<svg viewBox="0 0 24 24">
<path d="M12 2l7 4v12l-7 4-7-4V6z"/>
</svg>

</div>

<div class="cat-name">Mesh</div>

</div>

<div class="cat-card" onclick="filterCategory('clothing')">

<div class="cat-icon">

<svg viewBox="0 0 24 24">
<path d="M12 3l4 3 3-1 2 4-3 2v8H6v-8L3 9l2-4 3 1z"/>
</svg>

</div>

<div class="cat-name">Clothing</div>

</div>

<div class="cat-card" onclick="filterCategory('accessories')">

<div class="cat-icon">

<svg viewBox="0 0 24 24">
<path d="M12 2l9 7-9 13L3 9l9-7z"/>
</svg>

</div>

<div class="cat-name">Accessories</div>

</div>

<div class="cat-card" onclick="filterCategory('decor')">

<div class="cat-icon">

<svg viewBox="0 0 24 24">
<path d="M4 10h16v8H4z"/>
</svg>

</div>

<div class="cat-name">Decor</div>

</div>

</div>

<div id="categoryView" style="display:none;">

<button class="back-btn" onclick="closeCategory()">
← Back
</button>

<ul class="item-list" id="categoryList"></ul>

</div>

</div>

<div id="tab-search" class="tab-content">

<input
type="text"
class="search-box"
placeholder="Search inventory..."
oninput="searchInventory(this.value)"
>

<ul class="item-list" id="searchResults"></ul>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const api = params.get("api");

let inventory = [];

if(api){
    loadInventory();
}

async function loadInventory(){

    try{

        const response = await fetch(api);

        const data = await response.json();

        inventory = data.map(v=>decodeURIComponent(v));

        renderInventory(inventory);

        updateStats();

    }catch(err){

        console.error(err);

        document.querySelector(".status-pill").innerHTML = `
        <div class="status-dot" style="background:#ff5b5b;box-shadow:none;"></div>
        OFFLINE
        `;
    }
}

function updateStats(){

    document.getElementById("totalItems").innerText =
    inventory.length;

    document.getElementById("fatpackCount").innerText =
    inventory.filter(v=>
        v.toLowerCase().includes("fatpack")
    ).length;
}

function renderInventory(items){

    const list = document.getElementById("inventory-list");

    list.innerHTML = "";

    if(!items.length){

        list.innerHTML = `
        <div class="empty">
        No folders detected.
        </div>
        `;

        return;
    }

    items.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `

        <input type="checkbox"
        class="item-cb itemCheck"
        value="${escapeHtml(item)}"
        onchange="updateSelectedCount()">

        <div>

            <div class="item-name">
            ${escapeHtml(item)}
            </div>

            <div class="item-tags">
            ${generateTags(item)}
            </div>

        </div>

        <div class="item-actions">

            <button class="action-btn"
            onclick="deliverItem(this,'${escapeJs(item)}')">
            Deliver
            </button>

            <button class="action-btn delete"
            onclick="deleteItem(this,'${escapeJs(item)}')">
            Delete
            </button>

        </div>
        `;

        list.appendChild(li);
    });
}

function generateTags(name){

    const lower = name.toLowerCase();

    let tags = "";

    if(lower.includes("fatpack"))
    tags += `<div class="tag">fatpack</div>`;

    if(lower.includes("demo"))
    tags += `<div class="tag">demo</div>`;

    if(lower.includes("reborn"))
    tags += `<div class="tag">reborn</div>`;

    if(lower.includes("legacy"))
    tags += `<div class="tag">legacy</div>`;

    const year = name.match(/\[(\d{4})-/);

    if(year)
    tags += `<div class="tag">${year[1]}</div>`;

    return tags;
}

async function deliverItem(btn,item){

    const old = btn.innerText;

    btn.innerText = "Wait...";

    try{

        await fetch(api,{
            method:"POST",
            body:item
        });

        btn.innerText = "Done ✔";

    }catch{

        btn.innerText = "Error";

    }

    setTimeout(()=>{
        btn.innerText = old;
    },2000);
}

async function deleteItem(btn,item){

    const old = btn.innerText;

    btn.innerText = "Wait...";

    try{

        await fetch(api,{
            method:"POST",
            body:"MENU_DEL:" + item
        });

        btn.innerText = "Check SL";

    }catch{

        btn.innerText = "Error";

    }

    setTimeout(()=>{
        btn.innerText = old;
    },2500);
}

async function deliverSelected(){

    const checked = [
        ...document.querySelectorAll(".itemCheck:checked")
    ];

    if(!checked.length)
    return;

    const payload =
    checked.map(cb=>cb.value).join("\n");

    const btn =
    document.querySelector(".btn-bulk");

    const old = btn.innerText;

    btn.innerText = "Sending...";

    try{

        await fetch(api,{
            method:"POST",
            body:payload
        });

        btn.innerText = "Delivered ✔";

    }catch{

        btn.innerText = "Error";

    }

    setTimeout(()=>{
        btn.innerText = old;
    },2200);
}

function updateSelectedCount(){

    document.getElementById("selectedCount").innerText =
    document.querySelectorAll(".itemCheck:checked").length;
}

document.getElementById("selectAll")
.addEventListener("change",e=>{

    document.querySelectorAll(".itemCheck")
    .forEach(cb=>{
        cb.checked = e.target.checked;
    });

    updateSelectedCount();
});

function searchInventory(query){

    query = query.toLowerCase();

    const filtered =
    inventory.filter(v=>
        v.toLowerCase().includes(query)
    );

    renderSearch(filtered);
}

function renderSearch(items){

    const list =
    document.getElementById("searchResults");

    list.innerHTML = "";

    items.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `

        <div>

            <div class="item-name">
            ${escapeHtml(item)}
            </div>

            <div class="item-tags">
            ${generateTags(item)}
            </div>

        </div>

        <div class="item-actions">

            <button class="action-btn"
            onclick="deliverItem(this,'${escapeJs(item)}')">
            Deliver
            </button>

        </div>
        `;

        list.appendChild(li);
    });
}

function filterCategory(type){

    document.getElementById("categoryGrid").style.display = "none";

    document.getElementById("categoryView").style.display = "block";

    const list =
    document.getElementById("categoryList");

    list.innerHTML = "";

    const filtered =
    inventory.filter(item=>{

        const n = item.toLowerCase();

        if(type==="hair")
        return n.includes("hair");

        if(type==="skin")
        return n.includes("skin");

        if(type==="mesh")
        return n.includes("mesh");

        if(type==="clothing")
        return n.includes("outfit") ||
               n.includes("shirt") ||
               n.includes("pant");

        if(type==="accessories")
        return n.includes("ring") ||
               n.includes("chain") ||
               n.includes("access");

        if(type==="decor")
        return n.includes("decor");

        return false;
    });

    filtered.forEach(item=>{

        const li = document.createElement("li");

        li.className = "item";

        li.innerHTML = `

        <div>

            <div class="item-name">
            ${escapeHtml(item)}
            </div>

            <div class="item-tags">
            ${generateTags(item)}
            </div>

        </div>

        <div class="item-actions">

            <button class="action-btn"
            onclick="deliverItem(this,'${escapeJs(item)}')">
            Deliver
            </button>

        </div>
        `;

        list.appendChild(li);
    });
}

function closeCategory(){

    document.getElementById("categoryGrid").style.display = "grid";

    document.getElementById("categoryView").style.display = "none";
}

async function refreshInventory(){

    document.querySelector(".status-pill").innerHTML = `
    <div class="status-dot"></div>
    SYNCING...
    `;

    await loadInventory();

    setTimeout(()=>{

        document.querySelector(".status-pill").innerHTML = `
        <div class="status-dot"></div>
        CONNECTED
        `;

    },800);
}

async function resetScript(){

    if(!confirm("Reset script memory?"))
    return;

    await fetch(api,{
        method:"POST",
        body:"CMD:RESET"
    });

    alert("Reset command sent.");
}

function switchTab(tabId,btnElement){

    document.querySelectorAll('.tab-btn')
    .forEach(btn=>{
        btn.classList.remove('active');
    });

    document.querySelectorAll('.tab-content')
    .forEach(tab=>{
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${tabId}`)
    .classList.add('active');

    btnElement.classList.add('active');
}

function escapeHtml(str){

    return str
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function escapeJs(str){

    return str
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

</script>

</body>
</html>
